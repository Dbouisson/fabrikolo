<title>Fabrikolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout : un cahier d'ateliers façon autocollants découpés — gros titre joueur, bouton « Surprise-moi », cartes-stickers à contour épais, carnet de tampons pour les enfants, bandeau de confiance pour les parents. Thème clair assumé (univers enfant). */
:root {
  --bg: #DDF0FF;
  --bg-2: #FFF6DA;
  --paper: #FFFFFF;
  --ink: #23264B;
  --muted: #565C7E;
  --line: #23264B;
  --soft-line: #C9D6EA;
  --sun: #FFC23D;
  --sun-soft: #FFF1C7;
  --pumpkin: #FF6B4A;
  --leaf: #2FB373;
  --sky: #3E7BFA;
  --pink: #FF7EB9;
  --lilac: #9B7BFF;
  --on-sun: #23264B;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 22px;
  --pop: 5px 5px 0 var(--ink);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: radial-gradient(circle at 12% 18%, var(--sun) 0 6px, transparent 7px), radial-gradient(circle at 88% 12%, var(--pink) 0 5px, transparent 6px), radial-gradient(circle at 78% 72%, var(--leaf) 0 6px, transparent 7px), radial-gradient(circle at 6% 82%, var(--lilac) 0 5px, transparent 6px), radial-gradient(circle at 50% 50%, var(--pumpkin) 0 4px, transparent 5px);
  background-size: 520px 520px; }
.wrap { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 64px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; text-wrap: balance; margin: 0; font-weight: 800; }
h1 { font-size: clamp(2.3rem, 8vw, 4.3rem); letter-spacing: -0.01em; }
h2 { font-size: clamp(1.7rem, 5.5vw, 2.6rem); }
h3 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--sky); font-weight: 700; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 8px; }
.label { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.note { color: var(--muted); font-size: 0.95rem; max-width: 65ch; }

/* Barre du haut */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 4px 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; background: none; border: 0; padding: 0; }
.brand svg { width: 42px; height: 42px; }
.stamps-mini { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
.stamps-mini b { background: var(--sun); border-radius: 999px; padding: 0 9px; font-variant-numeric: tabular-nums; }

/* Héros */
.hero-home { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: center; padding-block: 18px 30px; }
@media (min-width: 780px) { .hero-home { grid-template-columns: 1.25fr 1fr; } }
.hero-home .copy { display: grid; gap: 16px; min-width: 0; }
.tag { justify-self: start; background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 4px 14px; font-weight: 800; font-size: 0.92rem; transform: rotate(-2deg); }
.hero-home h1 .hl { background: linear-gradient(transparent 58%, var(--sun) 58% 92%, transparent 92%); padding-inline: 4px; }
.hero-home .lead { font-size: 1.12rem; color: var(--muted); max-width: 46ch; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { border: 3px solid var(--line); border-radius: 999px; padding: 10px 20px; font-weight: 800; font-family: var(--font-display); font-size: 1.1rem; background: var(--sun); color: var(--on-sun); box-shadow: 4px 4px 0 var(--ink); }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.blue { background: var(--sky); color: #fff; }
.btn.ghost { background: var(--paper); }
.btn.small { font-size: 0.95rem; padding: 6px 14px; box-shadow: 3px 3px 0 var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.mascot-stage { position: relative; display: grid; place-items: center; min-height: 230px; }
.mascot-stage svg.mascot { width: min(300px, 80%); height: auto; }
.bubble { position: absolute; top: 4%; right: 4%; background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; padding: 8px 14px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; box-shadow: 3px 3px 0 var(--ink); transform: rotate(3deg); max-width: 60%; }

/* Bandeau parents */
.trust { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; margin-block: 6px 34px; }
.trust div { background: var(--paper); border: 2.5px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.trust svg { width: 44px; height: 44px; }
.trust strong { display: block; font-family: var(--font-display); font-size: 1.1rem; line-height: 1.2; }
.trust span { color: var(--muted); font-size: 0.93rem; }

/* Carnet de tampons */
.carnet { background: var(--bg-2); border: 3px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; margin-block: 0 34px; box-shadow: var(--pop); }
.carnet .row { justify-content: space-between; }
.stamp-row { display: flex; flex-wrap: wrap; gap: 10px; }
.stamp { width: 58px; height: 58px; border-radius: 50%; border: 3px dashed var(--soft-line); display: grid; place-items: center; background: transparent; padding: 0; }
.stamp svg { width: 40px; height: 40px; opacity: .25; filter: grayscale(1); }
.stamp.on { border: 3px solid var(--line); background: var(--paper); transform: rotate(-8deg); }
.stamp.on svg { opacity: 1; filter: none; }

/* Filtres et grille */
.moment { margin-block: 8px 34px; }
/* ---------- Ambiance de saison : fond, confettis et bandeau changent avec le calendrier ; les couleurs des fiches ne bougent pas ---------- */
.moment { --m-bg: #23264B; --m-title: #FFC23D; --m-text: #fff; background: var(--m-bg); color: var(--m-text); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: var(--pop); padding: 20px 18px 22px; }
.moment h2 { color: var(--m-title); }
.moment .lead { color: var(--m-text); opacity: .92; }
.moment .card { color: var(--ink); }
.moment .btn.ghost { background: #fff; color: var(--ink); }
:root[data-moment="halloween"] { --bg: #FFE6D2; --bg-2: #FFF0E3; --c1: #FF7A1A; --c2: #23264B; --c3: #9B7BFF; }
:root[data-moment="halloween"] .moment { --m-bg: #1E1B33; --m-title: #FF8A1F; }
:root[data-moment="noel"] { --bg: #FCE4E4; --bg-2: #FFF3E6; --c1: #D7263D; --c2: #1E8A5A; --c3: #F2B705; }
:root[data-moment="noel"] .moment { --m-bg: #A61B2B; --m-title: #FFD76A; }
:root[data-moment="noel"] .countdown { background: #FFD76A; color: var(--ink); }
:root[data-moment="hiver"] { --bg: #E4F1FF; --bg-2: #F3F9FF; --c1: #FFFFFF; --c2: #7FB2F0; --c3: #B9D8FF; }
:root[data-moment="hiver"] .moment { --m-bg: #1F3A6E; --m-title: #BFE0FF; }
:root[data-moment="hiver"] .countdown { background: #7FB2F0; color: var(--ink); }
:root[data-moment="printemps"] { --bg: #E9F8E4; --bg-2: #FFF4F8; --c1: #FF7EB9; --c2: #2FB373; --c3: #FFC23D; }
:root[data-moment="printemps"] .moment { --m-bg: #1E6E47; --m-title: #FFD1E6; }
:root[data-moment="ete"] { --bg: #FFF4D1; --bg-2: #E5F6FF; --c1: #FFC23D; --c2: #3E7BFA; --c3: #FF6B4A; }
:root[data-moment="ete"] .moment { --m-bg: #0E5E96; --m-title: #FFE27A; }
:root[data-moment="automne"] { --bg: #FBEBD6; --bg-2: #FFF5E8; --c1: #C8641E; --c2: #2FB373; --c3: #8A4B1F; }
:root[data-moment="automne"] .moment { --m-bg: #6E3A14; --m-title: #FFC98A; }
:root[data-moment="paques"] { --bg: #F1F9E8; --bg-2: #FFF6E0; --c1: #FFC23D; --c2: #FF9DC4; --c3: #7FD28C; }
:root[data-moment="paques"] .moment { --m-bg: #5B3FA8; --m-title: #FFE27A; }
:root[data-moment="paques"] .countdown { background: #FFE27A; color: var(--ink); }
:root[data-moment] body::before { background-image: radial-gradient(circle at 12% 18%, var(--c1) 0 6px, transparent 7px), radial-gradient(circle at 88% 12%, var(--c2) 0 5px, transparent 6px), radial-gradient(circle at 78% 72%, var(--c3) 0 6px, transparent 7px), radial-gradient(circle at 6% 82%, var(--c1) 0 5px, transparent 6px), radial-gradient(circle at 50% 50%, var(--c2) 0 4px, transparent 5px); }

.moment .lead { margin-top: -6px; }
.countdown { font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; background: var(--pumpkin); color: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px; box-shadow: 3px 3px 0 var(--ink); }
.moment-more { text-align: center; margin-top: 18px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-block: 0 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 0 22px; }
.chip { border: 2.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 0.95rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 22px; }
.card { --c: var(--sun); position: relative; background: var(--paper); border: 3px solid var(--line); border-radius: var(--r); padding: 0; text-align: left; display: grid; grid-template-rows: auto 1fr; overflow: hidden; box-shadow: var(--pop); }
.card:nth-child(3n+1) { transform: rotate(-0.6deg); }
.card:nth-child(3n+2) { transform: rotate(0.5deg); }
.card:hover { transform: translateY(-4px) rotate(0deg); box-shadow: 7px 9px 0 var(--ink); }
.card .art { background: color-mix(in srgb, var(--c) 26%, white); border-bottom: 3px solid var(--line); display: grid; place-items: center; padding-block: 16px; }
.card .art svg { width: 128px; height: 128px; }
.card .body { padding: 14px 16px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card .cat { justify-self: start; background: var(--c); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font-weight: 800; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
.card p { color: var(--muted); font-size: 0.97rem; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.dots { letter-spacing: 1px; color: var(--pumpkin); }
.done-badge { position: absolute; top: 12px; right: 12px; background: var(--leaf); color: #fff; border: 2.5px solid var(--line); border-radius: 999px; padding: 2px 12px; font-family: var(--font-display); font-weight: 800; transform: rotate(8deg); }
.card.idea { background: var(--bg-2); grid-template-rows: 1fr; border-style: dashed; box-shadow: none; transform: none; cursor: default; }
.card.idea .body { align-content: center; justify-items: start; gap: 10px; padding: 22px; }
.empty { color: var(--muted); padding-block: 24px; }
.art.photo { position: relative; padding: 0 !important; overflow: hidden; }
.art.photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.hero .art.photo img { aspect-ratio: 1; }
.art.photo .credit { position: absolute; left: 8px; bottom: 8px; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font-weight: 800; font-size: 0.8rem; }
.gold-box { display: grid; gap: 10px; margin-top: 14px; background: linear-gradient(135deg, #FFF6D0, #FFE7A1); border: 3px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.gold-box strong { font-family: var(--font-display); font-size: 1.25rem; }
.stamp.gold { border-color: #C99A00; background: radial-gradient(circle, #FFF3B8, #FFD24A); box-shadow: 0 0 0 3px #FFE58A; }
.stamps-mini b.gold { background: #FFD24A; }
.lang select { font: inherit; font-weight: 800; font-size: 0.9rem; background: var(--paper); color: var(--ink); border: 2.5px solid var(--line); border-radius: 999px; padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 14px; }
.gallery figure { margin: 0; background: var(--bg-2); border: 2.5px solid var(--line); border-radius: 16px; overflow: hidden; }
.gallery img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-bottom: 2.5px solid var(--line); }
.gallery figcaption { padding: 6px 10px 8px; display: grid; font-size: 0.9rem; }
.gallery figcaption span { color: var(--muted); }
.gallery .cdc { color: var(--pumpkin) !important; font-weight: 800; }
.concours { display: grid; gap: 2px; background: var(--sun-soft); border: 2.5px dashed var(--line); border-radius: 14px; padding: 10px 14px; }
.concours strong { font-family: var(--font-display); font-size: 1.15rem; }
a.btn { text-decoration: none; display: inline-block; }
footer { margin-top: 44px; color: var(--muted); font-size: 0.9rem; display: grid; gap: 6px; }

/* Fiche ouverte */
.back { background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 5px 14px; font-weight: 800; box-shadow: 3px 3px 0 var(--ink); }
.hero { --c: var(--sun); display: grid; grid-template-columns: 1fr; gap: 20px; align-items: center; margin-block: 16px 22px; background: var(--paper); border: 3px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--pop); }
@media (min-width: 740px) { .hero { grid-template-columns: 230px 1fr; } }
.hero .art { background: color-mix(in srgb, var(--c) 26%, white); border: 3px solid var(--line); border-radius: 18px; display: grid; place-items: center; padding: 14px; }
.hero .art svg { width: 100%; max-width: 190px; height: auto; }
.hero .intro { display: grid; gap: 12px; min-width: 0; }
.hero .intro > p { color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
.facts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.fact { background: var(--bg); border-radius: 14px; padding: 8px 12px; }
.fact strong { display: block; font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.skills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.skill { background: var(--sun-soft); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font-weight: 800; font-size: 0.86rem; }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding-block: 8px; margin-block: 0 18px; scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 3; }
.tab { background: var(--paper); border: 2.5px solid var(--line); border-radius: 999px; padding: 6px 16px; font-weight: 800; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--sun); box-shadow: 3px 3px 0 var(--ink); }
.panel { display: grid; gap: 18px; background: var(--paper); border: 3px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel > p { max-width: 65ch; }

/* Matériel */
.check { display: grid; gap: 2px; list-style: none; padding: 0; margin: 0; }
.check label { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 2px dashed var(--soft-line); cursor: pointer; }
.check input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--leaf); }
.check .why { display: block; color: var(--muted); font-size: 0.92rem; }
.check input:checked + span { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.progress { font-weight: 800; font-variant-numeric: tabular-nums; font-family: var(--font-display); font-size: 1.15rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Mélange */
.calc { background: var(--bg-2); border: 2.5px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; }
.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--paper); font-size: 1.3rem; line-height: 1; font-weight: 800; }
.stepper output { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 2.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: none; padding: 6px 14px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.qty { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.qty div { background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; }
.qty strong { display: block; font-family: var(--font-display); font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.timer { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Étapes */
.session { display: grid; gap: 12px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--sun); border: 2.5px solid var(--line); color: var(--on-sun); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.focus { background: var(--bg-2); border: 3px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 18px; min-height: 280px; align-content: space-between; }
.focus .big { font-size: clamp(1.35rem, 4.8vw, 1.9rem); line-height: 1.3; font-family: var(--font-display); font-weight: 700; }
.bar { height: 12px; background: var(--paper); border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--leaf); }
.dry { border: 2.5px dashed var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; background: var(--bg-2); }
.science { background: color-mix(in srgb, var(--sky) 14%, white); border: 2.5px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; }
.science strong { font-family: var(--font-display); font-size: 1.15rem; }
.done-box { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: color-mix(in srgb, var(--leaf) 18%, white); border: 3px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.done-box strong { font-family: var(--font-display); font-size: 1.25rem; }

/* Dépannage */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 0.97rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 2px dashed var(--soft-line); }
th { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 800; }
.bullets { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 65ch; }
.sources { margin-top: 26px; }

@media (prefers-reduced-motion: no-preference) {
  .card, .btn, .chip, .tab, .stamp { transition: transform .15s, box-shadow .15s, background .15s; }
  .mascot-stage svg.mascot { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  .stamp.pop { animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.4) rotate(-30deg); } 70% { transform: scale(1.15) rotate(-4deg); } 100% { transform: scale(1) rotate(-8deg); } }
}
</style>

<script>
/* ---------- Données : une activité = un objet. Ajouter une fiche = ajouter un objet. ---------- */
const UPDATED = "30 septembre 2026";
const ACTIVITIES = [
  {
    id: "vitraux",
    titre: "Vitraux repositionnables",
    accroche: "Des feuilles d'automne en colle colorée, qui se collent et se décollent des vitres sans laisser de trace.",
    saisons: ["Automne", "Toute l'année"],
    categorie: "Bricolage",
    couleur: "var(--pumpkin)",
    age: "7 ans et + seul, plus tôt avec un adulte",
    ageMin: 4,

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* Vitrail en feuille d'érable, dessiné à la main */
function leafSVG() {
  const C = [100, 118];
  const tips = [[100, 10], [140, 30], [172, 58], [186, 110], [156, 150], [106, 176], [94, 176], [44, 150], [14, 110], [28, 58], [60, 30]];
  const cols = ["#F07A1A", "#E9A800", "#D9481C", "#7DBE3C", "#F07A1A", "#E9A800", "#E9A800", "#D9481C", "#7DBE3C", "#F07A1A", "#E9A800"];
  const far = p => [C[0] + (p[0] - C[0]) * 1.6, C[1] + (p[1] - C[1]) * 1.6];
  let panes = "";
  for (let i = 0; i < tips.length; i++) {
    const a = far(tips[i]), b = far(tips[(i + 1) % tips.length]);
    panes += `<polygon points="${C} ${a} ${b}" fill="${cols[i]}" opacity=".92"/>`;
  }
  const leaf = "M100 10 L112 48 L140 30 L134 66 L172 58 L150 92 L186 110 L146 118 L156 150 L118 134 L106 176 L94 176 L82 134 L44 150 L54 118 L14 110 L50 92 L28 58 L66 66 L60 30 L88 48 Z";
  const veins = [[100, 10], [172, 58], [186, 110], [156, 150], [44, 150], [14, 110], [28, 58]].map(t => `<line x1="${C[0]}" y1="${C[1]}" x2="${t[0]}" y2="${t[1]}"/>`).join("");
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Vitrail en forme de feuille d'érable">
    <defs><clipPath id="lc"><path d="${leaf}"/></clipPath></defs>
    <g clip-path="url(#lc)">${panes}<g stroke="#1B1B1B" stroke-width="4" stroke-linecap="round">${veins}</g></g>
    <path d="${leaf}" fill="none" stroke="#1B1B1B" stroke-width="6" stroke-linejoin="round"/>
    <line x1="100" y1="176" x2="100" y2="196" stroke="#1B1B1B" stroke-width="6" stroke-linecap="round"/>
  </svg>`;
}

function patronBoiteSVG() {
  const s = 12, L = 24 * s, H = 6 * s, ox = 30;

    const cuts = [3, 9, 15, 21].map(c => `<line x1="${ox + c * s}" y1="${y}" x2="${ox + c * s}" y2="${y + H}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`).join("");
    const diags = [3, 15].map(c => `<line x1="${ox + c * s}" y1="${y + H}" x2="${ox + (c + 6) * s}" y2="${y}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`).join("");
    const glue = [0, 21].map(c => `<rect x="${ox + c * s}" y="${y}" width="${3 * s}" height="${H}" fill="var(--sun-soft)"/>`).join("");
    const mid = fenetre
      ? `<circle cx="${ox + 12 * s}" cy="${y + H / 2}" r="${2 * s}" fill="none" stroke="var(--pumpkin)" stroke-width="3"/>`
      : `<text x="${ox + 12 * s}" y="${y + H / 2 + 5}" text-anchor="middle" fill="var(--ink)" font-size="13" font-family="Atkinson Hyperlegible, sans-serif">dessin</text>`;
    return `${glue}<rect x="${ox}" y="${y}" width="${L}" height="${H}" fill="none" stroke="var(--ink)" stroke-width="2"/>${cuts}${diags}${mid}
      <text x="${ox - 10}" y="${y + H / 2 + 5}" text-anchor="end" fill="var(--ink)" font-size="15" font-weight="700" font-family="Atkinson Hyperlegible, sans-serif">${label}</text>`;
  };
  const t = (x, y, txt, c = "var(--muted)") => `<text x="${x}" y="${y}" text-anchor="middle" fill="${c}" font-size="12" font-family="Atkinson Hyperlegible, sans-serif">${txt}</text>`;
  const top = 26, gap = 34;
  return `<svg viewBox="0 0 ${L + 50} ${top + 2 * H + gap + 50}" style="max-width:480px;width:100%;height:auto" role="img" aria-label="Patron : deux bandes de 6 par 24 centimètres, découpées en 3, 6, 6, 6 et 3 centimètres, avec diagonales dans les carrés 1 et 3">
    ${t(ox + 1.5 * s, top - 8, "3")}${t(ox + 6 * s, top - 8, "6")}${t(ox + 12 * s, top - 8, "6")}${t(ox + 18 * s, top - 8, "6")}${t(ox + 22.5 * s, top - 8, "3 cm")}

"flocons-papier": {

  accroche: "A square of paper folded into a triangle, a few snips, and unfold: a one-of-a-kind snowflake to stick on windows or hang from the ceiling.",
  age: "age 5+; the grown-up helps with thick folds",
  materiel: [["Thin paper: printer paper, tracing paper, coffee filters", "The thinner, the easier to cut when folded."], ["Pointed scissors for the grown-up, round-tipped for the child", ""], ["A pencil", "To draw the cuts before cutting."], ["Thread or sticky tack", "To hang or stick."]],

"pluie-bocal": {
  titre: "Rain in a jar",
  accroche: "A shaving-foam cloud on top of water, drops of colour on it… and suddenly it starts raining in the jar.",
  age: "age 3+",
  materiel: [["A big jar or clear vase", ""], ["Water", "Three quarters of the jar."], ["Shaving foam", "The grown-up puts it on."], ["Liquid food colouring diluted in a little water", "Blue for rain, or several colours."], ["A dropper or spoon", ""]],
  seances: [{ titre: "Make it rain", etapes: ["Fill the jar three quarters full of water.", "The grown-up puts a thick layer of shaving foam on the water: that's the cloud.", "With the dropper, drip diluted colouring onto the cloud.", "Keep going, drop after drop… and watch under the cloud.", "When the cloud is too heavy, streaks of colour fall into the water: it's raining!"] }],

  variante: "Several colours in different spots on the cloud make rainbow rain.",
  depannage: [["It won't rain", "Cloud too thick", "Less foam, or more drops in the same spot."], ["It falls too fast", "Cloud too thin", "Add more foam."], ["Colour is pale", "Colouring too diluted", "Less water in the colouring."]],

  seances: [{ titre: "Set up", etapes: ["Arrange the glasses in a circle.", "Every other glass: fill it three quarters with water, with one colour (red, yellow, blue). The others stay empty.", "Fold strips of kitchen roll in two or three lengthwise.", "Lay each strip in an arch: one end in a full glass, the other in the empty glass next to it.", "So each empty glass gets two strips, coming from two different colours."] }, { titre: "Watch", etapes: ["See the water climb the paper in the first few minutes.", "Come back every hour: the empty glasses fill up.", "What colour appears between red and yellow? Between yellow and blue?", "Draw the result before and after."] }],
  science: "The water climbs the kitchen roll thanks to capillary action: it creeps into the tiny spaces between the paper fibres, even upwards. That's also how water rises up plant stems.",

de: {
"vitraux": {
  titre: "Fensterbilder zum Abziehen",
  accroche: "Herbstblätter aus farbigem Kleber, die am Fenster haften und sich spurlos wieder abziehen lassen.",
  age: "allein ab 7 Jahren, jünger mit einem Erwachsenen",
  materiel: [["Flüssiger weißer Bastelkleber (Holzleim/Schulkleber)", "Oder transparenter Flüssigkleber. Kein Klebestift."], ["Spülmittel", "Am besten farblos."], ["Flüssige oder Gel-Lebensmittelfarbe", "Durchscheinender als Wasser- oder Acrylfarbe."], ["Klarsichthüllen", "Oder eine laminierte Folie. Kein Backpapier: Es saugt den Kleber auf."], ["Einfache Ausmalbilder zum Einlegen", "Blätter, Kürbis, Pilz: große Flächen."], ["Ein Töpfchen und ein Löffel pro Farbe", ""], ["Pinsel mit festen Borsten", ""], ["Schwarzer Permanentmarker", "Für die Konturen, nach dem Trocknen."], ["Ein Zahnstocher", "Zum Aufstechen von Blasen."], ["Klebeband, Schürze, Tischdecke", "Die Farbe färbt ab."]],
  seances: [{ titre: "1. Runde · malen", etapes: ["Tisch abdecken und die Hülle mit dem Ausmalbild flach festkleben.", "Pro Farbe ein Töpfchen anrühren und 2 bis 3 Minuten ruhen lassen: Die Mischung soll dickflüssig bleiben.", "Zuerst den Rand jeder Fläche malen, dann ausfüllen.", "Eine gleichmäßige Schicht ohne Lücken: Zu dünn reißt sie, zu dick trocknet sie nicht.", "Für Farbverläufe zwei Farben nass nebeneinander setzen.", "Blasen mit dem Zahnstocher aufstechen.", "Flach und geschützt trocknen lassen: mindestens über Nacht, bei dicker Schicht bis zu 48 Std."] }, { titre: "2. Runde · fertigstellen und aufkleben", etapes: ["Trocknung prüfen: Das Bild muss überall durchscheinend sein, ohne weiße Stellen.", "Konturen mit dem schwarzen Marker direkt auf dem Bild nachziehen.", "Marker ein paar Minuten trocknen lassen.", "Langsam von einer Ecke aus abziehen.", "Fenster putzen und trocknen, dann das Bild andrücken und die Luft von der Mitte nach außen streichen."] }],
  variante: "Für die Kleinsten: eine Ausstechform auf die Folie legen, ausfüllen und nach ein paar Minuten abnehmen.",
  depannage: [["Reißt beim Abziehen", "Schicht zu dünn oder nicht trocken", "Warten, langsamer abziehen oder eine zweite Schicht darüber malen."], ["In der Mitte weiß", "Dicke Schicht, nicht durchgetrocknet", "Noch 24 Std. warten."], ["Farben laufen ineinander", "Zu viel Mischung auf einmal", "Weniger Mischung, zuerst die Konturen."], ["Hält nicht am Fenster", "Scheibe schmutzig oder feucht", "Putzen, gut trocknen, neu andrücken."], ["Zu klebrig, hinterlässt Spuren", "Zu viel Spülmittel", "Im nächsten Töpfchen weniger nehmen."], ["Blasse Farben", "Wasser- oder Acrylfarbe", "Lebensmittelfarbe verwenden."]],
  securite: ["Bastelkleber und Lebensmittelfarbe sind kindgerecht, aber nicht zum Essen.", "Den Permanentmarker benutzt ein Erwachsener oder ein geübtes Kind, bei offenem Fenster.", "Zum Aufbewahren die Bilder wieder auf eine Klarsichthülle kleben.", "Wenn ein Bild festklebt: kurz föhnen oder mit einem Kunststoffschaber lösen.", "Spuren auf der Scheibe gehen mit heißem Wasser weg."]
},
"culbuto": {
  titre: "Purzel-Kästchen",
  accroche: "Ein kleines, geschlossenes Papierröhrchen mit einer Murmel drin, das ganz allein eine Schräge hinunterpurzelt.",
  age: "ab 5 Jahren, Schere mit einem Erwachsenen; die Murmel nicht unter 3 Jahren",
  materiel: [["Festes Papier: Aktendeckel, Tonkarton oder 160–200 g/m²", "Dünnes Papier knickt ein und klemmt die Murmel."], ["Eine Murmel mit etwa 1,5 cm Durchmesser", "Sie muss im 1,9-cm-Röhrchen frei rollen."], ["Durchsichtiges Klebeband", ""], ["Schere", ""], ["Lineal und Bleistift", ""], ["Ein Brett oder dickes Buch, mit Filz oder Moosgummi bezogen", "Auf glatter Fläche rutscht das Kästchen, statt zu purzeln."], ["Filzstifte oder Aufkleber", "Optional, gleichmäßig verzieren."]],
  seances: [{ titre: "Das Kästchen bauen", etapes: ["Ein Rechteck von 9,5 × 9 cm auf das Papier zeichnen und ausschneiden.", "An der 9,5-cm-Seite alle 1,9 cm eine Linie ziehen: So entstehen 5 Streifen.", "An beiden Enden jede Linie 1,5 cm tief einschneiden (rote Linien der Vorlage): Das werden die Laschen.", "Die Falzlinien mit einem leeren Kuli am Lineal vorritzen, dann falten.", "Ein Vierkantrohr formen: Der 5. Streifen schiebt sich unter den 1. Auf ganzer Länge festkleben.", "An einem Ende die 4 Laschen nach innen biegen, leicht rund formen und festkleben.", "Die Murmel hineingeben und das andere Ende genauso schließen.", "Nach Lust verzieren, gleichmäßig auf allen vier Seiten."] }, { titre: "Purzeln lassen", etapes: ["Das Filzbrett leicht schräg stellen: Ein Buch unter einem Ende reicht für den Anfang.", "Das Kästchen oben längs zur Schräge hinlegen und loslassen.", "Die Neigung anpassen: zu steil, und es rutscht; zu flach, und es bleibt stehen."] }],
  science: "Die Murmel rollt ans untere Ende des Röhrchens und verlagert dorthin das Gewicht. Das Kästchen kippt über dieses Ende, die Murmel rollt zum anderen Ende, und alles beginnt von vorn. So funktionieren alte Purzelspielzeuge.",
  variante: "Weiterforschen: Glasmurmel und Stahlkugel oder zwei Röhrchenlängen vergleichen – was purzelt am besten?",
  depannage: [["Rutscht, statt zu purzeln", "Fläche zu glatt", "Schräge mit Filz, Moosgummi oder Teppich belegen."], ["Bleibt unterwegs stehen", "Zu flach oder Murmel reibt", "Schräge etwas erhöhen, prüfen, ob die Murmel frei rollt."], ["Murmel klemmt", "Röhrchen zerdrückt oder Murmel zu groß", "Aus dickerem Papier neu bauen oder kleinere Murmel nehmen."], ["Kippt zur Seite", "Röhrchen schief oder einseitig schwere Deko", "Saubere Falze, Deko leichter machen."], ["Ein Ende geht auf", "Laschen schlecht geklebt", "Eine Runde Klebeband ums Ende wickeln."]],
  securite: ["Eine Murmel ist für Kinder unter 3 Jahren gefährlich (Verschlucken): außer Reichweite kleiner Geschwister halten.", "Die Scheren-Einschnitte sind kurz und genau: Das kann ein Erwachsener übernehmen.", "Vor dem Spielen prüfen, ob beide Enden gut verschlossen sind."]
},

  seances: [{ titre: "Sessione 1 · dipingere", etapes: ["Proteggi il tavolo e fissa la busta ben piatta con il nastro, con il disegno dentro.", "Prepara un vasetto per colore e lascialo riposare 2 o 3 minuti: il miscuglio deve restare denso.", "Dipingi prima il bordo di ogni zona, poi riempi il centro.", "Cerca di fare uno strato uniforme, senza buchi. Troppo sottile si strappa; troppo spesso non si asciuga.", "Per una sfumatura, metti due colori uno accanto all'altro finché sono ancora bagnati.", "Scoppia le bolle con lo stuzzicadenti.", "Lascia asciugare in piano, in un posto tranquillo: almeno una notte, fino a 48 h se lo strato è spesso."] }, { titre: "Sessione 2 · rifinire e attaccare", etapes: ["Controlla che sia asciutto: il pezzo deve essere trasparente dappertutto, senza macchie bianche.", "Ripassa i contorni con il pennarello nero, direttamente sul pezzo.", "Lascia asciugare il pennarello qualche minuto.", "Stacca piano piano, partendo da un angolo.", "Pulisci e asciuga il vetro, poi premi il pezzo spingendo l'aria dal centro verso i bordi."] }],

  seances: [{ titre: "Costruire la scatolina", etapes: ["Disegna un rettangolo di 9,5 × 9 cm sulla carta spessa e ritaglialo.", "Lungo il lato da 9,5 cm, traccia una linea ogni 1,9 cm: ottieni 5 strisce.", "A entrambe le estremità, taglia lungo ogni linea per 1,5 cm (le linee rosse sul modello): diventano le alette.", "Segna le pieghe passando una penna scarica lungo ogni linea contro il righello, poi piega.", "Forma un tubo quadrato: la 5ª striscia va sotto la 1ª. Fissa con il nastro per tutta la lunghezza.", "A un'estremità, piega le 4 alette verso l'interno arrotondandole un po', poi fissale con il nastro.", "Metti dentro la biglia, poi chiudi l'altra estremità allo stesso modo.", "Decora se vuoi, in modo uguale su tutti e quattro i lati."] }, { titre: "Farla capriolare", etapes: ["Appoggia l'asse ricoperta di feltro in leggera pendenza: per cominciare basta un libro sotto un'estremità.", "Metti la scatolina in cima, distesa nel senso della discesa, e lasciala andare.", "Regola la pendenza: troppo ripida e scivola; troppo poco e si ferma."] }],
  science: "La biglia rotola verso l'estremità più bassa del tubo e porta lì il peso. La scatolina si ribalta su quel lato, la biglia rotola verso l'altra estremità e tutto ricomincia. È l'idea dei vecchi giocattoli acrobati.",
  variante: "Per andare oltre: confronta una biglia di vetro e una sfera d'acciaio, oppure due lunghezze di tubo, e scopri quale fa le capriole meglio.",
  depannage: [["Scivola senza fare capriole", "Superficie troppo liscia", "Ricopri la discesa con feltro, gommapiuma o un tappeto."], ["Si ferma a metà", "Pendenza troppo leggera, o biglia che sfrega", "Alza un po' la pendenza, controlla che la biglia rotoli libera."], ["La biglia si blocca", "Tubo schiacciato o biglia troppo grande", "Rifallo con carta più spessa, o usa una biglia più piccola."], ["Cade su un fianco", "Tubo storto o decorazione pesante da un lato", "Fai pieghe ben nette, alleggerisci la decorazione."], ["Un'estremità si apre", "Alette fissate male", "Aggiungi una fascia di nastro intorno all'estremità."]],
  securite: ["Una biglia può soffocare i bambini sotto i 3 anni: tienila lontana da fratellini e sorelline.", "I tagli con le forbici sono corti e precisi: può farli un adulto.", "Prima di giocare, controlla che le due estremità siano ben chiuse."]

  materiel: [["Un quarto di cavolo rosso", ""], ["Una pentola d'acqua e un colino", "Per l'adulto."], ["Bicchieri trasparenti", "Almeno 4."], ["Aceto bianco e succo di limone", "Le “pozioni acide”."], ["Bicarbonato di sodio", "La “polvere che fa diventare blu”."], ["Un cucchiaino per ogni ingrediente", ""]],

"volcan": {

  materiel: [["Una bottiglietta di plastica (330 ml)", ""], ["Una grande bacinella o una teglia", "Il vulcano trabocca!"], ["Sabbia, terra o pasta di sale", "Per costruire la montagna."], ["1 bicchiere di aceto bianco", ""], ["2 cucchiai di bicarbonato di sodio", ""], ["Colorante alimentare rosso o sciroppo di granatina", "Per il colore della lava."], ["Un po' di detersivo per piatti", "Facoltativo: più schiuma."]],
  seances: [{ titre: "Costruire", etapes: ["Metti la bottiglia in piedi al centro della bacinella.", "Costruisci tutto intorno una montagna di sabbia umida, lasciando libero il collo.", "Versa nella bottiglia l'aceto, il colorante e una goccia di detersivo per piatti."] }, { titre: "L'eruzione", etapes: ["Tutti fanno un passo indietro.", "Versa il bicarbonato nel collo in un colpo solo (aiuta un imbuto di carta).", "Guarda la lava fare schiuma e scendere lungo i fianchi.", "Riprova con quantità diverse: più bicarbonato, eruzione più grande?"] }],

  materiel: [["Una bacinella d'acqua", ""], ["Plastilina", "Un pezzo grande come una pallina da ping-pong."], ["Oggetti di casa", "Tappo di sughero, cucchiaio, palla, chiave, mela, matita, sasso…"], ["Piccoli tesori come carico", "Biglie, graffette, monete: sotto lo sguardo di un adulto."], ["Un foglio e una matita", "Per scrivere le previsioni."]],
  seances: [{ titre: "Prevedere e provare", etapes: ["Metti gli oggetti vicino alla bacinella e disegna due colonne: “galleggia” e “affonda”.", "Per ogni oggetto, il bambino prima fa la sua previsione, poi lo prova nell'acqua.", "Confronta previsioni e risultati: qualche sorpresa?"] }, { titre: "La sfida della barchetta", etapes: ["Fai una pallina di plastilina e mettila nell'acqua: affonda.", "Prendi la stessa plastilina e appiattiscila in una barchetta con i bordi alti.", "Appoggiala piano: galleggia!", "Carica la barchetta con le biglie una alla volta. Quante prima che affondi?", "Prova un'altra forma di barchetta per battere il record."] }],

  variante: "Aggiungi tanto sale all'acqua e prova con un uovo: nell'acqua salata torna a galla.",

  materiel: [["Cartone spesso (scatola da spedizione)", "Per il disco."], ["Una ciotola o un compasso", "Per tracciare un cerchio di circa 10 cm di diametro."], ["7 fili da ricamo di colori diversi", "Circa 50 cm ciascuno."], ["Forbici, e un taglierino per l'adulto", ""], ["Una matita", "Per numerare le tacche."]],

  materiel: [["Bicarbonato di sodio", "Circa mezza confezione."], ["Aceto bianco", "Un bicchiere per ogni colore."], ["Coloranti alimentari", "Rosso, giallo, blu: basta per tutto l'arcobaleno."], ["Una pirofila, una vaschetta per il ghiaccio o uno stampo da muffin", ""], ["Contagocce, o cucchiaini per i più piccoli", ""], ["Vasetti o bicchierini", "Uno per colore."]],
  seances: [{ titre: "Prepara", etapes: ["Stendi un bello strato di bicarbonato nella pirofila, oppure riempi ogni scomparto della vaschetta per il ghiaccio.", "Versa l'aceto in ogni vasetto e aggiungi un colore diverso.", "Mescola rosso e giallo per l'arancione, giallo e blu per il verde, rosso e blu per il viola."] }, { titre: "Fallo frizzare", etapes: ["Aspira un po' di aceto colorato col contagocce.", "Fai cadere qualche goccia sul bicarbonato: sfrigola subito!", "Cambia colore e riempi tutti gli scomparti, oppure disegna un arcobaleno nella pirofila.", "Guarda i colori che si mescolano quando due eruzioni si incontrano."] }],
  science: "Aceto e bicarbonato reagiscono e producono un gas, l'anidride carbonica. Sono le sue bollicine a fare la schiuma. Quando in un punto il bicarbonato finisce, la schiuma si ferma: aggiungine ancora.",

  depannage: [["Non frizza più", "Tutto il bicarbonato ha reagito", "Aggiungi un altro strato."], ["I colori diventano marroni", "Troppi colori mescolati", "Usa uno scomparto nuovo per ogni colore, oppure svuota e ricomincia."], ["Il contagocce non aspira niente", "Vasetto troppo vuoto", "Riempi il vasetto per almeno 2 cm."]],
  securite: ["L'aceto brucia negli occhi: niente mani negli occhi, e lavale dopo.", "I coloranti macchiano: grembiule e tavolo coperto."]

"pate-a-patouille": {

  accroche: "Amido di mais e acqua formano un materiale stranissimo: duro come il legno se lo colpisci, liquido se lo lasci colare tra le dita.",
  age: "dai 18 mesi, sempre con un adulto",
  materiel: [["2 tazze di amido di mais", "Maizena o simile."], ["1 tazza d'acqua", "Versala poco alla volta."], ["Colorante alimentare", "Facoltativo."], ["Una pirofila grande o una bacinella", ""], ["Cucchiai, un imbuto, piccoli personaggi", "Per giocare."]],
  seances: [{ titre: "Prepara e gioca", etapes: ["Versa l'amido di mais nella pirofila.", "Aggiungi l'acqua (e il colorante) poco alla volta, mescolando con le dita.", "La consistenza giusta: se la picchietti, resiste; se la sollevi piano, cola.", "Troppo liquida? Un po' di amido. Troppo dura? Qualche goccia d'acqua.", "Dai un bel pugno, poi appoggia la mano piano piano: affonda!", "Fai una pallina rotolandola veloce tra le mani, poi fermati: si scioglie."] }],
  science: "È un fluido «non newtoniano». Minuscoli granelli di amido galleggiano nell'acqua. Quando spingi forte e veloce, si incastrano tra loro e la pasta diventa dura. Quando vai piano, hanno il tempo di scivolare e cola come un liquido.",
  variante: "Nascondici dentro dei piccoli personaggi e «salvali» con un cucchiaio.",
  depannage: [["Tutta liquida", "Troppa acqua", "Aggiungi amido un cucchiaio alla volta."], ["Tutta dura e friabile", "Troppo poca acqua", "Qualche goccia d'acqua."], ["Si è seccata", "Evaporazione", "Aggiungi un po' d'acqua e rimescola."]],
  securite: ["Non versarla mai nel lavandino: può intasare gli scarichi. Lasciala seccare e buttala nella spazzatura.", "Anche se sono ingredienti da cucina, non si mangia.", "Con i più piccini, un adulto resta vicino per tutto il tempo."]

  age: "dai 5 anni; l'adulto aiuta con le pieghe spesse",
  materiel: [["Carta sottile: carta da stampante, carta da lucido, filtri da caffè", "Più è sottile, più è facile da tagliare quando è piegata."], ["Forbici a punta per l'adulto, a punta tonda per il bambino", ""], ["Una matita", "Per disegnare i tagli prima di tagliare."], ["Filo o gommino adesivo", "Per appendere o attaccare."]],

  age: "dai 3 anni",
  materiel: [["Un barattolo grande o un vaso trasparente", ""], ["Acqua", "Tre quarti del barattolo."], ["Schiuma da barba", "La mette l'adulto."], ["Colorante alimentare liquido diluito in un po' d'acqua", "Blu per la pioggia, o più colori."], ["Un contagocce o un cucchiaino", ""]],

  materiel: [["6 bicchieri trasparenti uguali", "Oppure 5, in fila o in cerchio."], ["Carta da cucina", "Strisce piegate per il lungo."], ["Colorante alimentare rosso, giallo e blu", ""], ["Acqua", ""]],
  seances: [{ titre: "Prepara", etapes: ["Metti i bicchieri in cerchio.", "Un bicchiere sì e uno no: riempilo d'acqua per tre quarti, con un colore (rosso, giallo, blu). Gli altri restano vuoti.", "Piega delle strisce di carta da cucina in due o in tre per il lungo.", "Metti ogni striscia ad arco: un'estremità in un bicchiere pieno, l'altra nel bicchiere vuoto accanto.", "Così ogni bicchiere vuoto riceve due strisce, che arrivano da due colori diversi."] }, { titre: "Osserva", etapes: ["Guarda l'acqua che sale lungo la carta nei primi minuti.", "Torna a guardare ogni ora: i bicchieri vuoti si riempiono.", "Che colore appare tra il rosso e il giallo? E tra il giallo e il blu?", "Disegna il risultato prima e dopo."] }],
  science: "L'acqua sale lungo la carta da cucina grazie alla capillarità: si infila nei minuscoli spazi tra le fibre della carta, anche verso l'alto. È così che l'acqua sale anche nei gambi delle piante.",

  depannage: [["L'acqua non sale", "Carta troppo corta o fuori dall'acqua", "L'estremità deve toccare il fondo del bicchiere pieno."], ["Il bicchiere vuoto non si riempie", "La carta tocca il bordo", "La carta deve arrivare fino al fondo del bicchiere vuoto."], ["Colori marroni", "Troppo colorante", "Bastano poche gocce."]],

  seances: [{ titre: "Componi", etapes: ["Ritaglia un teschio ovale nella carta bianca, disegna le orbite e il naso, e incollalo in alto sul foglio.", "Colonna vertebrale: allinea 3 o 4 cotton fioc uno dopo l'altro sotto il teschio.", "Costole: ai due lati della colonna, incolla 3 mezzi cotton fioc un po' inclinati.", "Braccia: per ogni braccio, un cotton fioc per la parte alta e uno per l'avambraccio, piegati al gomito.", "Gambe: lo stesso, un cotton fioc per la coscia e uno per la parte bassa della gamba.", "Mani e piedi: pezzetti disposti a ventaglio.", "Dagli una posa: che balla, che corre, che saluta."] }],

"gouter-halloween": {

  materiel: [["Banane", "Mezza banana per ogni fantasma."], ["Clementine", ""], ["Gocce di cioccolato o uvetta", "Per gli occhi e la bocca dei fantasmi."], ["Un gambo di sedano o una foglia di menta", "Per il picciolo delle zucche."], ["Un coltello per l'adulto", ""]],
  seances: [{ titre: "Prepara", etapes: ["L'adulto taglia le banane a metà per il largo.", "Metti ogni metà in piedi, con il lato tagliato in basso: è il fantasma.", "Infila due gocce di cioccolato per gli occhi, e una più grande (o un'uvetta) per la bocca.", "Sbuccia le clementine lasciando gli spicchi uniti.", "L'adulto taglia un pezzetto di sedano e lo infila al centro, in alto: è il picciolo della zucca.", "Disponi fantasmi e zucche su un piatto grande, e buon appetito."] }],

  securite: ["Attenzione alle allergie (frutta a guscio, cioccolato) se vengono degli amici.", "Taglia l'uvetta e i pezzetti duri per i bambini sotto i 3 anni.", "Il coltello resta all'adulto."]

  titre: "Bowling delle mummie",
  accroche: "Dieci rotoli fasciati come mummie, una palla, e si comincia: il gioco perfetto per una festa di Halloween in casa.",

  materiel: [["10 rotoli di carta igienica vuoti", "Oppure bottiglie di plastica vuote."], ["Carta igienica, strisce di carta bianca o garza", "Per le bende."], ["Nastro adesivo o colla", ""], ["Occhi disegnati su carta, o occhietti mobili", ""], ["Una palla di media grandezza", ""], ["Un pennarello e un foglio", "Per i punti."]],
  seances: [{ titre: "Prepara le mummie", etapes: ["Attacca l'inizio di una striscia al rotolo, poi avvolgila intorno, incrociandola un po', come una benda.", "Lascia un piccolo spazio tra due strisce all'altezza degli occhi.", "Incolla gli occhi nello spazio.", "Se i rotoli sono troppo leggeri e cadono da soli, metti sul fondo un po' di sabbia o di plastilina."] }, { titre: "Gioca", etapes: ["Disponi le 10 mummie a triangolo: 4, 3, 2, 1.", "Ogni giocatore ha due tiri a turno, da una linea di nastro adesivo sul pavimento.", "Conta le mummie cadute e segna i punti.", "Per i più piccoli, avvicina la linea; per i più grandi, allontanala."] }],
  variante: "Gara delle mummie a squadre: un bambino tiene il rotolo di carta igienica e fascia un amico il più in fretta possibile. Vince la prima mummia finita!",
  depannage: [["Le mummie cadono al minimo soffio", "Troppo leggere", "Un po' di sabbia sul fondo."], ["Nessuno ne butta giù", "Linea troppo lontana o palla troppo leggera", "Avvicina la linea, usa una palla più pesante."]],

  titre: "Cappello da strega",
  accroche: "Un cono di carta nera, una tesa larga ritagliata da un disco e stelle dorate: un vero cappello da strega o da mago da indossare la notte di Halloween.",
  age: "dai 5 anni; la tesa la disegna e la taglia l'adulto",
  materiel: [["2 fogli grandi di carta nera spessa (A3 o più grandi)", ""], ["Un pezzo di spago e una matita", "Per tracciare un grande arco come un compasso."], ["Forbici, nastro adesivo, colla", ""], ["Carta dorata, adesivi a stella, nastro arancione o viola", "Per decorare."], ["Un metro da sarta", "Per misurare la testa."]],

  variante: "Punta piegata: pizzica la cima del cono e piegala di lato — ancora più da strega.",

  securite: ["Niente cappelli di carta vicino a una candela accesa."]

"chat-noir-assiette": {

  age: "dai 3 anni",
  materiel: [["Un piatto di carta", ""], ["Colore nero", ""], ["Carta gialla o verde, carta rosa", "Per gli occhi, il naso e l'interno delle orecchie."], ["Carta o cartoncino nero", "Per le orecchie."], ["Colla, forbici, pennarello", ""], ["Elastico o un bastoncino", "Per la versione maschera."]],
  seances: [{ titre: "Realizza", etapes: ["Dipingi di nero tutto il piatto e lascia asciugare.", "Ritaglia due triangoli neri per le orecchie, e due triangolini rosa per l'interno.", "Incolla le orecchie in alto, dietro il piatto.", "Ritaglia due grandi occhi gialli a mandorla; disegna al centro una pupilla nera verticale.", "Aggiungi un nasino rosa a triangolo e i baffi fatti con strisce di carta bianca.", "Versione maschera: l'adulto ritaglia gli occhi, poi pinza un elastico o incolla un bastoncino sotto il mento."] }],

es: {
"vitraux": {
  titre: "Vidrieras despegables",
  accroche: "Hojas de otoño hechas con cola de colores que se pegan en las ventanas y se despegan sin dejar marca.",
  age: "a partir de 7 años solos, más pequeños con un adulto",
  materiel: [["Cola blanca escolar (líquida)", "O cola líquida transparente. No sirve la barra de pegamento."], ["Lavavajillas líquido", "Transparente, si puede ser."], ["Colorante alimentario líquido o en gel", "Más transparente que la témpera o la pintura acrílica."], ["Fundas de plástico para folios", "O una hoja plastificada. No papel de horno: absorbe la cola."], ["Dibujos sencillos para colorear que quepan en las fundas", "Hojas, calabaza, seta: zonas grandes."], ["Un vasito y una cuchara por color", ""], ["Pinceles de cerdas duras", ""], ["Rotulador permanente negro", "Para los contornos, una vez seco."], ["Un palillo", "Para reventar las burbujas."], ["Cinta adhesiva, delantal, mantel", "El colorante mancha."]],
  seances: [{ titre: "Sesión 1 · pintar", etapes: ["Protege la mesa y fija la funda bien plana con cinta, con el dibujo dentro.", "Prepara un vasito por color y déjalo reposar 2 o 3 minutos: la mezcla tiene que quedar espesa.", "Pinta primero el borde de cada zona y después rellena el centro.", "Busca una capa uniforme y sin huecos. Si es muy fina, se rompe; si es muy gruesa, no se seca.", "Para hacer un degradado, pon dos colores juntos mientras aún están húmedos.", "Revienta las burbujas con el palillo.", "Deja secar en plano, en un sitio tranquilo: como mínimo una noche, hasta 48 h si la capa es gruesa."] }, { titre: "Sesión 2 · acabar y pegar", etapes: ["Comprueba que está seco: la pieza tiene que ser transparente por todas partes, sin manchas blancas.", "Repasa los contornos con el rotulador negro, directamente sobre la pieza.", "Deja secar el rotulador unos minutos.", "Despega despacio, empezando por una esquina.", "Limpia y seca la ventana, y luego apoya la pieza apretando para sacar el aire desde el centro hacia los bordes."] }],
  variante: "Para los más pequeños: rellena un cortapastas colocado sobre el plástico y retíralo al cabo de unos minutos.",
  depannage: [["Se rompe al despegar", "Capa demasiado fina o sin secar", "Espera, despega más despacio o pinta otra capa encima."], ["Blanco en el centro", "Capa gruesa, aún no seca del todo", "Déjalo 24 h más."], ["Los colores se mezclan por todas partes", "Demasiada mezcla de golpe", "Menos mezcla, primero los contornos."], ["No se pega a la ventana", "Cristal sucio o húmedo", "Limpia, seca bien y vuelve a apretar."], ["Demasiado pegajoso, deja marcas", "Demasiado lavavajillas", "Pon menos en el siguiente vasito."], ["Colores apagados", "Témpera o pintura acrílica", "Usa colorante alimentario."]],
  securite: ["La cola escolar y el colorante alimentario son aptos para niños, pero no se comen.", "El rotulador permanente, para un adulto o un niño con soltura, con la ventana abierta.", "Para guardar las piezas, vuelve a pegarlas sobre una funda de plástico.", "Si una pieza se queda pegada: un poco de aire del secador para ablandarla, o una rasqueta de plástico.", "Las marcas del cristal se quitan con agua caliente."]
},
"culbuto": {
  titre: "Caja volteadora",
  accroche: "Un pequeño tubo de papel cerrado, con una canica dentro, que da volteretas él solito por una pendiente.",
  age: "a partir de 5 años con un adulto para las tijeras; la canica no es para menores de 3 años",
  materiel: [["Papel grueso: carpeta de cartulina, cartulina o papel de 160–200 g", "El papel fino se aplasta y atrapa la canica."], ["Una canica de unos 1,5 cm de diámetro", "Tiene que rodar libremente dentro del tubo de 1,9 cm."], ["Cinta adhesiva transparente", ""], ["Tijeras", ""], ["Regla y lápiz", ""], ["Una tabla o un libro grande forrado de fieltro o goma eva", "Sobre una superficie lisa, la caja se desliza en vez de voltear."], ["Rotuladores o pegatinas", "Opcional: decora sin cargar más un lado que otro."]],
  seances: [{ titre: "Fabricar la caja", etapes: ["Dibuja un rectángulo de 9,5 × 9 cm en el papel grueso y recórtalo.", "A lo largo del lado de 9,5 cm, traza una línea cada 1,9 cm: salen 5 franjas.", "En los dos extremos, corta cada línea 1,5 cm (líneas rojas de la plantilla): así se forman las solapas.", "Marca los pliegues pasando un bolígrafo gastado por cada línea, apoyado en la regla, y luego dobla.", "Forma un tubo cuadrado: la 5.ª franja se mete debajo de la 1.ª. Pega cinta a lo largo de todo el tubo.", "En un extremo, dobla las 4 solapas hacia dentro, redondeándolas un poco, y pega con cinta.", "Mete la canica y cierra el otro extremo de la misma manera.", "Decora si quieres, por igual en las cuatro caras."] }, { titre: "Hacerla voltear", etapes: ["Coloca la tabla con fieltro en una pendiente suave: para empezar basta con un libro debajo de un extremo.", "Pon la caja arriba, tumbada a lo largo de la pendiente, y suéltala.", "Ajusta la pendiente: si es muy empinada, se desliza; si es muy suave, se para."] }],
  science: "La canica rueda hasta el extremo más bajo del tubo y lleva allí el peso. La caja se vuelca por ese extremo, la canica rueda hasta el otro, y vuelta a empezar. Es la idea de los antiguos juguetes volteadores.",
  variante: "Para ir más lejos: compara una canica de cristal con una bola de acero, o dos tubos de distinta longitud, y mira cuál voltea mejor.",
  depannage: [["Se desliza sin voltear", "Superficie demasiado lisa", "Cubre la pendiente con fieltro, goma eva o una alfombra."], ["Se para a mitad de camino", "Pendiente demasiado suave o la canica roza", "Sube un poco la pendiente y comprueba que la canica rueda libre."], ["La canica se atasca", "Tubo aplastado o canica demasiado grande", "Hazlo otra vez con papel más grueso, o usa una canica más pequeña."], ["Se cae de lado", "Tubo torcido o decoración pesada en un lado", "Haz pliegues bien marcados y aligera la decoración."], ["Se abre un extremo", "Solapas mal pegadas", "Añade una tira de cinta alrededor del extremo."]],
  securite: ["Una canica puede causar atragantamiento en menores de 3 años: mantenla lejos de los hermanitos.", "Los cortes con tijera son cortos y precisos: puede hacerlos un adulto.", "Comprueba que los dos extremos están bien cerrados antes de jugar."]
},
"tampons": {
  titre: "Sellos de rollos de cartón",
  accroche: "Rollos de papel higiénico pellizcados en forma de corazón, gota o círculo para estampar motivos pintados.",
  age: "a partir de 3 años; un adulto puede dar forma a los rollos",
  materiel: [["Rollos vacíos de papel higiénico o de cocina", "Uno por forma y por color."], ["Pintura espesa: témpera o acrílica", "La pintura líquida emborrona."], ["Platos llanos o tapas", "Una capa fina de pintura en cada plato."], ["Papel de dibujo grueso", ""], ["Cinta adhesiva", "Para sujetar una forma que se abre."], ["Delantal y mantel", ""]],
  seances: [{ titre: "Fabricar los sellos", etapes: ["Círculo: deja el rollo tal cual. Sirve para burbujas, ruedas, ojos.", "Gota u hoja: pellizca con fuerza un lado del rollo de arriba abajo.", "Corazón: aplasta el rollo, empuja un pliegue hacia dentro y redondea los dos bultos.", "Cuadrado: aplasta, vuelve a abrir y marca cuatro pliegues iguales.", "Si una forma se abre, rodéala con una tira de cinta."] }, { titre: "Estampar", etapes: ["Echa una capa fina de pintura en cada plato.", "Moja el borde del rollo, sin hundirlo.", "Aprieta recto sobre el papel y levanta de una vez.", "Compón: cinco gotas en círculo forman una flor; un círculo y dos gotas, un bichito por inventar.", "Deja secar en plano y termina con rotuladores (tallos, ojos, antenas)."] }],
  variante: "Para un cuadro de regalo: una sola forma, en tres o cuatro colores superpuestos por toda la hoja.",
  depannage: [["La marca se emborrona", "Demasiada pintura o muy líquida", "Capa más fina en el plato, pintura más espesa."], ["Marca incompleta", "Apretado torcido o borde estropeado", "Aprieta recto; iguala el borde del rollo con tijeras."], ["La forma se deforma", "Rollo empapado de pintura", "Una tira de cinta o un rollo nuevo."]],
  securite: ["La témpera y la acrílica infantil se lavan en húmedo; la acrílica seca mancha la ropa.", "Que los pequeños no se metan los rollos pintados en la boca."]
},
"montgolfiere": {
  titre: "Globo aerostático de bolsa de basura",
  accroche: "Una bolsa de basura grande y muy ligera, llena de aire caliente del secador, que sube flotando hasta el techo.",
  age: "a partir de 5 años como espectadores activos; el adulto sujeta el secador",
  materiel: [["Una bolsa de basura grande y muy fina (unos 90 L)", "Lo más ligera posible: las bolsas gruesas no despegan."], ["Un secador de pelo", "Aire caliente, velocidad alta."], ["Cinta adhesiva", "Para tapar los agujeros."], ["Unos cuantos clips", "Un poco de peso abajo la mantiene estable."], ["Una habitación sin corrientes de aire y con techo alto", "O al aire libre en un día sin nada de viento."]],
  seances: [{ titre: "¡Despegue!", etapes: ["Comprueba que la bolsa no tiene agujeros y tapa con cinta los que encuentres.", "Pon dos o tres clips alrededor de la abertura.", "Un niño sujeta la parte de arriba de la bolsa, con la abertura hacia abajo; otro mantiene la abertura bien abierta.", "El adulto sopla aire caliente por la abertura, sin tocar el plástico con la boquilla.", "Calienta de 1 a 2 minutos, hasta que la bolsa esté llena y tire hacia arriba.", "Apaga el secador, contad hasta tres y soltad todos a la vez."] }],
  science: "El aire caliente ocupa más espacio que el aire frío con el mismo peso. Por eso la bolsa llena de aire caliente pesa menos que el aire que la rodea, y sube. Cuando el aire se enfría, encoge y la bolsa baja: así funcionan los globos aerostáticos de verdad.",
  variante: "Para ir más lejos: cronometra el vuelo con 1, 2 y luego 3 clips, y compara.",
  depannage: [["No despega", "Bolsa demasiado pesada o aire poco caliente", "Bolsa más fina, calentar más tiempo, quitar un clip."], ["Se da la vuelta en el aire", "Sin peso abajo", "Añade un clip a cada lado de la abertura."], ["Cae enseguida", "Un agujero o una corriente de aire", "Tapa los agujeros, cierra puertas y ventanas."]],
  securite: ["Nada de velas ni llamas bajo la bolsa: el plástico se derrite y arde. Con el secador es suficiente.", "Una bolsa de plástico nunca se pone en la cabeza: hay riesgo de asfixia, recuérdaselo a los niños.", "La boquilla del secador se calienta: la sujeta el adulto."]
},

  accroche: "Dibuja con lana que sale de un bolígrafo vacío, sobre un marco de cinta adhesiva: la lana se queda allí por donde pasa tu mano.",
  age: "a partir de 4 años; el adulto recorta el marco con un cúter",
  materiel: [["Un trozo de cartón plano (caja de cereales, paquete)", "De unos 20 × 25 cm."], ["Un cúter y unas tijeras", "El cúter es para el adulto."], ["Cinta adhesiva transparente ancha (de embalar)", ""], ["Un bolígrafo que se pueda desmontar", "Quédate solo con el cuerpo y la punta."], ["Lana fina o mediana, de varios colores", "Evita la lana gruesa o esponjosa: no pasa o se pega mal."]],
  seances: [{ titre: "Preparar el marco y el bolígrafo", etapes: ["El adulto recorta una ventana de unos 10 × 18 cm en el centro del cartón, dejando un borde de 4–5 cm alrededor.", "Cubre toda la ventana con tiras de cinta que se monten un poco, pegadas al marco.", "Da la vuelta al marco: ahora la cara adhesiva de la cinta mira hacia arriba.", "Desmonta el bolígrafo: quita el tapón del final y el tubo de tinta, y quédate con el cuerpo y la punta.", "Mete la lana por arriba del cuerpo y sácala por la punta."] }, { titre: "Dibujar", etapes: ["Aprieta el extremo de la lana contra la cinta con un dedo y coge el bolígrafo como para escribir.", "Mueve el bolígrafo apretando un poco: la lana se tumba y se pega detrás.", "Haz curvas, espirales y bucles: las esquinas en punta se sujetan peor.", "Para cambiar de color, corta la lana a ras de la cinta y mete otra.", "Para conservar el dibujo, cúbrelo con otra capa de cinta."] }],
  variante: "Para los más pequeñitos: sin bolígrafo, colocando la lana sobre la cinta con los dedos; ya queda precioso.",
  depannage: [["La lana se despega detrás del bolígrafo", "Lana demasiado tensa", "Deja algo de holgura entre el ovillo y el bolígrafo."], ["La lana no sale del bolígrafo", "Lana demasiado gruesa o punta demasiado estrecha", "Lana más fina, o usa el bolígrafo sin la punta."], ["Las esquinas no se sujetan", "Cambio de dirección demasiado brusco", "Redondéalas o sujeta la esquina con un dedo."], ["La cinta ya no pega", "Polvo, dedos, pelos", "Pon una tira de cinta nueva encima."]],
  securite: ["El cúter es solo para el adulto.", "No dejes a un niño pequeño solo con lana (riesgo de que se le enrolle en el cuello)."]
},
"boite-masu": {
  titre: "Cajita de origami",
  accroche: "Una caja cuadrada doblada con una sola hoja, sin cola ni tijeras, con su tapa, para regalar con un pequeño tesoro dentro.",
  age: "a partir de 7 años, o más pequeños con un adulto que guíe los pliegues",
  materiel: [["Dos cuadrados de cartulina fina, p. ej. de 15 × 15 cm y 15,5 × 15,5 cm", "El más grande es para la tapa. El papel normal sirve, pero se rompe con más facilidad."], ["Una regla y una plegadera, o el dorso de una cuchara", "Para marcar bien los pliegues."], ["Rotuladores o pegatinas", "Opcional, para decorar."]],
  seances: [{ titre: "Doblar la caja", etapes: ["Dobla el cuadrado por las dos diagonales y desdobla: las marcas se cruzan en el centro.", "Dobla las cuatro esquinas hacia el centro.", "Dobla el borde de arriba hasta la línea del centro y desdobla. Haz lo mismo con el borde de abajo, y luego con el izquierdo y el derecho.", "Desdobla las esquinas izquierda y derecha: te queda una forma alargada con dos puntas dobladas hacia dentro.", "Levanta los dos lados largos por los pliegues: son las dos primeras paredes.", "Levanta un extremo abierto: sus pliegues forman la tercera pared. Dobla su punta por encima de la pared, hacia el fondo de la caja.", "Haz lo mismo en el otro lado y aplasta bien las puntas en el fondo."] }, { titre: "La tapa", etapes: ["Dobla el cuadrado un poco más grande exactamente igual.", "Colócalo sobre la caja: tiene que entrar sin forzar."] }],
  variante: "Tres cajas de tamaños crecientes se meten una dentro de otra como muñecas rusas: una sorpresa dentro de otra sorpresa.",
  depannage: [["Las paredes no se sostienen", "Pliegues poco marcados", "Repasa cada pliegue con la plegadera antes de montar la caja."], ["La tapa no entra", "Cuadrados del mismo tamaño", "Usa un cuadrado 5 mm más grande para la tapa."], ["El papel se rompe en las esquinas", "Papel demasiado fino o demasiado grueso", "Cartulina fina (unos 160 g) o papel de origami."]],
  securite: ["Ningún riesgo especial: sin cola y sin tijeras si los cuadrados se cortan antes."]
},
"boite-surprise": {
  titre: "Caja sorpresa",
  accroche: "Dos tiras de cartulina se convierten en un pequeño marco que dice «Ábreme». Despliégalo y aparece un dibujo secreto por la ventana.",
  age: "a partir de 7 años; un adulto ayuda con la ventana y con el primer pegado",
  materiel: [["Cartulina blanca (160–200 g)", "Dos tiras de 6 × 24 cm. El papel normal sirve, pero se rompe enseguida."], ["Regla y lápiz", ""], ["Plegadera o un bolígrafo gastado", "Para marcar los pliegues antes de doblar."], ["Tijeras, o un cúter para el adulto", "Para la ventana redonda."], ["Barra de pegamento", ""], ["Rotuladores", "Para el dibujo secreto y la decoración del marco."]],
  seances: [{ titre: "Trazar y doblar", etapes: ["Recorta dos tiras de 6 × 24 cm.", "En cada tira, traza líneas a 3, 9, 15 y 21 cm: salen 3 cm, tres cuadrados de 6 cm y otros 3 cm.", "En el 1.er y el 3.er cuadrado de cada tira, traza una diagonal, en el mismo sentido en los dos cuadrados (mira la plantilla).", "Marca todas las líneas con la plegadera a lo largo de la regla y dóblalas hacia los dos lados para suavizarlas.", "En la tira A, recorta una ventana redonda de unos 4 cm en el cuadrado del centro."] }, { titre: "Decorar", etapes: ["En la tira B, dibuja la sorpresa en el cuadrado del centro: un animalito inventado, un mensaje, un corazón.", "En la tira A, decora alrededor de la ventana y escribe «Ábreme»."] }, { titre: "Montar", etapes: ["Pega un extremo de 3 cm de la tira B sobre el otro extremo: la tira se convierte en un anillo cuadrado, y los dos extremos de 3 cm juntos forman el 4.º lado.", "Haz lo mismo con la tira A, con el dibujo de B mirando hacia dentro.", "Mete el anillo B dentro del anillo A, cruzado, para que el dibujo quede justo detrás de la ventana.", "Aplástalo todo siguiendo las diagonales: la caja se pliega en un pequeño marco plano.", "Para abrirla, aprieta dos lados opuestos: la caja se abre en 3D y aparece la sorpresa."] }],
  variante: "Para una fiesta: una caja por invitado, con su nombre en la ventana.",
  depannage: [["No se pliega en plano", "Diagonales en sentidos distintos o sin marcar", "Vuelve a hacer las diagonales en el mismo sentido, bien marcadas."], ["El dibujo no queda detrás de la ventana", "Anillos descentrados", "Vuelve a centrar el anillo B antes de que se seque la cola."], ["La unión pegada se abre", "Poca cola o cartulina demasiado gruesa", "Pega toda la zona de 3 cm y aprieta 30 segundos."], ["El papel se rompe en los pliegues", "Papel demasiado fino", "Cartulina de 160 g como mínimo."]],
  securite: ["La ventana con cúter la hace el adulto; con tijeras, haz primero un agujerito en el centro."]
},
"pate-a-sel": {
  titre: "Masa de sal",
  accroche: "Tres ingredientes de cocina para modelar hojas, setas o bichitos, que se pintan una vez secos.",
  age: "a partir de 3 años; el horno es cosa del adulto",
  materiel: [["2 tazas de harina", "Harina de trigo normal."], ["1 taza de sal fina", "La sal gorda deja granos."], ["1 taza de agua tibia", "Échala poco a poco."], ["Un bol para mezclar", ""], ["Rodillo, cortapastas, palillos", "Un tenedor y hojas de árbol para hacer marcas."], ["Papel de horno y una bandeja de horno", ""], ["Pintura acrílica o témpera", "Para decorar cuando esté totalmente seco."]],
  seances: [{ titre: "Preparar y modelar", etapes: ["Mezcla la harina y la sal en el bol.", "Añade el agua tibia poco a poco sin dejar de remover, y amasa 5 minutos.", "Una buena masa forma una bola que no se pega a los dedos: si está muy seca, añade un poco de agua; si está muy pegajosa, un poco de harina.", "Estira la masa con un grosor de 5 mm a 1 cm, no más: cuanto más fina, antes se seca.", "Recorta, modela y presiona hojas de árbol o un tenedor para darle textura.", "Para colgarla, haz un agujero con una pajita antes de secarla."] }, { titre: "Secar y pintar", etapes: ["Al aire: deja las piezas sobre papel de horno de 1 a 2 días según el grosor, dándoles la vuelta.", "En el horno: el adulto las hornea a temperatura baja (unos 100 °C) durante varias horas. Las piezas gruesas se secan antes un poco al aire para que no se agrieten.", "Cuando la pieza suena seca y no cede bajo el dedo, déjala enfriar.", "Píntala solo cuando esté totalmente seca."] }],
  variante: "Para tener masa de colores desde el principio, añade unas gotas de colorante alimentario al agua.",
  depannage: [["La masa se desmigaja", "Falta agua", "Añade agua con los dedos mojados y vuelve a amasar."], ["La masa se pega", "Demasiada agua", "Enharina la superficie de trabajo y amasa."], ["Se hincha o se agrieta en el horno", "Horno demasiado caliente o pieza demasiado gruesa", "Baja el horno, sécala antes al aire, hazla más fina."], ["Se ablanda al cabo de unos días", "Humedad", "Guárdala en un sitio seco; una capa de barniz la protege."]],
  securite: ["La masa de sal es muy salada: no se prueba, y es peligrosa para perros y gatos que puedan comérsela.", "El horno y la bandeja caliente son cosa del adulto."]
},
"photophore": {
  titre: "Farolillo monstruo",
  accroche: "Un tarro de mermelada forrado de papel de seda se convierte en un pequeño farolillo de Halloween, con ojos de monstruo y una gran sonrisa.",
  age: "a partir de 4 años",
  materiel: [["Un tarro de cristal limpio (de mermelada)", "Etiqueta quitada con agua caliente."], ["Papel de seda de colores", "Verde, morado, naranja: en trocitos rasgados."], ["Cola blanca y un pincel", "Un poco diluida, se seca transparente."], ["Papel negro o rotulador negro", "Para la boca y los ojos; o ojos móviles."], ["Una vela LED", "Nunca una llama de verdad."], ["Lana o un limpiapipas", "Opcional, para el pelo alrededor del cuello del tarro."]],
  seances: [{ titre: "Forrar el tarro", etapes: ["Rasga el papel de seda en trozos del tamaño de un sello.", "Mezcla la cola con un poco de agua en un vasito.", "Pon cola en una zona del tarro con el pincel, coloca trozos de papel y vuelve a pasar cola por encima.", "Cubre todo el tarro, montando unos trozos sobre otros.", "Deja secar unas horas: la cola blanca se vuelve transparente."] }, { titre: "Dar vida al monstruo", etapes: ["Recorta una boca de papel negro, con dientes en zigzag, y pégala.", "Añade uno, dos o tres ojos: ¡es un monstruo!", "Enrolla lana o un limpiapipas alrededor del cuello del tarro.", "Mete la vela LED, apaga la luz y a disfrutar."] }],
  variante: "Varios tarros de distintos colores en el alféizar de la ventana forman una familia de monstruos.",
  depannage: [["Se queda blanco", "La cola aún no se ha secado o está muy espesa", "Espera, y la próxima vez dilúyela un poco más."], ["El papel se despega", "Falta cola por encima", "Pasa más cola por los bordes."], ["La luz es muy débil", "Demasiadas capas de papel", "Con una o dos capas basta."]],
  securite: ["Solo velas LED: una vela de verdad en un tarro forrado de papel puede prender.", "Comprueba que el tarro no está desportillado."]
},
"couronne-automne": {
