  age: "a partir de 4 años; el adulto recorta el aro",
  materiel: [["Cartón reciclado (caja de cereales) o un plato de papel", ""], ["Dos boles de distinto tamaño", "Para dibujar los dos círculos."], ["Papel de colores (naranja, rojo, amarillo, marrón)", "O hojas de verdad, secas y planas."], ["Cola líquida y tijeras", "Una perforadora con forma de hoja, si tienes."], ["Papel blanco y rotulador negro", "Para la silueta del centro."], ["Cordel", "Para colgarla."]],
  seances: [{ titre: "Hacer la corona", etapes: ["Dibuja un círculo grande alrededor del bol grande y luego uno pequeño en el centro con el bol pequeño.", "El adulto recorta el aro.", "Dibuja y recorta hojas de papel de colores, o sal a recoger hojas de verdad.", "Pega las hojas por todo el aro, montando unas sobre otras, hasta que no se vea el cartón.", "Dibuja un animal del bosque (zorro, erizo, ardilla), coloréalo de negro y recórtalo.", "Pégalo en el centro, uniéndolo al aro por una pata o por la cola.", "Ata un cordel arriba para colgarla."] }],
  variante: "Sal antes de paseo: recoge hojas de formas distintas y aprende sus nombres (roble, arce, castaño) antes de pegarlas.",
  depannage: [["Las hojas de verdad se desmigajan", "Hojas demasiado secas", "Cógelas recién caídas y sécalas 2 días entre dos libros."], ["El cartón se ondula", "Demasiada cola líquida", "Menos cola, o barra de pegamento."], ["La silueta no se sujeta", "Pocos puntos de unión", "Únela al aro por dos sitios."]],
  securite: ["Las tijeras de punta y el recorte del centro son cosa del adulto con los más pequeños."]
},
"fantomes": {
  titre: "Fantasmas con bastoncillos",
  accroche: "Sobre papel negro, da toquecitos de pintura blanca con bastoncillos para hacer fantasmas, y luego dibuja grandes ojos redondos y bocas de sorpresa.",
  age: "a partir de 3 años",
  materiel: [["Papel negro o azul oscuro", "Papel de dibujo grueso, si puede ser."], ["Témpera blanca", "Espesa, sin diluir."], ["Un puñado de bastoncillos de algodón", "Varios sujetos con una goma rellenan más rápido."], ["Rotulador negro o papel negro", "Para los ojos y la boca, una vez seco."], ["Un plato llano", "Para la pintura."]],
  seances: [{ titre: "Dar toquecitos", etapes: ["Echa un poco de pintura blanca en el plato.", "Esboza las siluetas de los fantasmas con lápiz blanco o tiza: redondeadas arriba, onduladas abajo.", "Moja el bastoncillo y da toquecitos muy juntos dentro de la silueta.", "Para ir más rápido, junta 5 o 6 bastoncillos con una goma: hacen un pincel grande de puntitos.", "Añade puntos más separados alrededor, como si fuera niebla.", "Deja secar un cuarto de hora."] }, { titre: "Darles vida", etapes: ["Dibuja dos grandes ojos redondos y una boca en forma de «O» con rotulador negro, o pega círculos de papel.", "Añade una luna, estrellas hechas con bastoncillos y un título: «¡Buuu!»."] }],
  variante: "La misma técnica en naranja para hacer calabazas, o con muchos colores para hacer fuegos artificiales.",
  depannage: [["Los puntos se juntan en una mancha", "Demasiada pintura en el bastoncillo", "Escúrrelo en el borde del plato antes de dar toquecitos."], ["El blanco no tapa el negro", "Pintura demasiado aguada", "Pintura pura, o dos capas."], ["El rotulador no se ve", "Pintura aún húmeda", "Espera a que esté totalmente seca."]],
  securite: ["Los bastoncillos no se meten en los oídos ni en la boca de los pequeños."]
},
"chauves-souris": {
  titre: "Murciélagos de rollos de cartón",
  accroche: "Un rollo de papel higiénico pintado de negro, dos alas de papel y ojos redondos: una colonia de murciélagos para colgar en Halloween.",
  age: "a partir de 4 años",
  materiel: [["Rollos vacíos de papel higiénico", "Uno por murciélago."], ["Pintura negra (o morada, verde: los murciélagos de colores también quedan bien)", ""], ["Papel negro o cartulina reciclada", "Para las alas."], ["Papel blanco y rotulador negro", "O ojos móviles."], ["Cola y tijeras", ""], ["Cordel", "Para colgarlos boca abajo."]],
  seances: [{ titre: "Fabricar", etapes: ["Pinta el rollo y déjalo secar.", "Dobla hacia dentro la parte de arriba del rollo, primero un lado y luego el otro: salen dos orejitas en punta.", "Dobla una hoja negra por la mitad y dibuja media ala ondulada pegada al pliegue. Recorta: las dos alas salen iguales.", "Pega las alas en la parte de atrás del rollo.", "Pega dos ojos redondos y dibuja una boca con dos colmillitos.", "Haz dos agujeritos abajo, pasa un cordel y cuelga el murciélago boca abajo."] }],
  science: "¿Sabías que…? Los murciélagos duermen boca abajo y se orientan en la oscuridad gracias al eco de sus gritos. En Francia todas las especies están protegidas: se comen miles de mosquitos cada noche.",
  variante: "Haz varios tamaños con rollos de cocina cortados: una familia entera.",
  depannage: [["Las orejas no se sujetan", "Cartón demasiado blando", "Un puntito de cola dentro del pliegue."], ["Las alas se caen", "La cola líquida no ha agarrado", "Cinta adhesiva por detrás, o cola fuerte."]],
  securite: ["Un adulto recorta las alas para los más pequeños."]
},
"citrouille-assiette": {
  titre: "Calabaza de plato de papel",
  accroche: "Un plato de papel pintado de naranja se convierte en una calabaza sonriente o terrorífica, con su tallo, su hoja y sus ojos recortados.",
  age: "a partir de 3 años",
  materiel: [["Un plato de papel", "O un círculo recortado en cartón."], ["Pintura naranja", "O roja y amarilla para mezclarla tú."], ["Papel negro, verde y marrón", "Para la cara, la hoja y el tallo."], ["Cola y tijeras", ""], ["Un pincel ancho o una esponja", ""]],
  seances: [{ titre: "Fabricar", etapes: ["Mezcla rojo y amarillo para conseguir naranja: ya es un pequeño experimento de colores.", "Pinta toda la parte de arriba del plato y deja secar.", "En papel negro, recorta dos ojos triangulares, una nariz y una boca en zigzag.", "Recorta un tallo marrón y una hoja verde.", "Pega la cara, y luego el tallo y la hoja arriba, por detrás del plato.", "Dibuja con rotulador unas cuantas líneas curvas de arriba abajo para marcar los gajos de la calabaza."] }],
  variante: "Una calabaza simpática y otra terrorífica en las dos caras del plato: dale la vuelta según tu humor.",
  depannage: [["El plato se ondula", "Demasiada pintura líquida", "Pintura más espesa, o usa una esponja."], ["El naranja sale sucio", "Demasiado rojo", "Empieza con amarillo y añade rojo poco a poco."]],
  securite: ["Tijeras adecuadas a la edad; el adulto recorta los detalles pequeños."]
},
"potion-chou-rouge": {
  titre: "Poción mágica de lombarda",
  accroche: "El zumo morado de la lombarda cambia de color como por arte de magia: rosa con vinagre, azul verdoso con bicarbonato. Una auténtica poción de mago.",
  age: "a partir de 4 años; el adulto prepara el zumo",
  materiel: [["Un cuarto de lombarda (col lombarda)", ""], ["Una cazuela con agua y un colador", "Para el adulto."], ["Vasos transparentes", "Por lo menos 4."], ["Vinagre blanco y zumo de limón", "Las «pociones ácidas»."], ["Bicarbonato sódico", "El «polvo que lo vuelve todo azul»."], ["Una cuchara por ingrediente", ""]],
  seances: [{ titre: "Preparar el zumo mágico", etapes: ["El adulto corta la lombarda en tiras y la cuece a fuego lento 10 minutos en el agua.", "Cuélalo y déjalo enfriar: el zumo es morado.", "Echa la misma cantidad de zumo en cada vaso."] }, { titre: "Hacer magia", etapes: ["Vaso 1: no lo toques, es el vaso de control.", "Vaso 2: añade una cucharada de vinagre. ¡Se vuelve rosa!", "Vaso 3: añade zumo de limón. ¿También rosa?", "Vaso 4: añade una cucharada de bicarbonato. Se vuelve azul o verde.", "Último truco: echa vinagre en el vaso azul. Hace burbujas y se vuelve morado, y luego otra vez rosa.", "Apunta los colores en una hoja: es una auténtica tabla de científico."] }],
  science: "El zumo de lombarda tiene un pigmento que cambia de color según si un líquido es ácido o no. El vinagre y el limón son ácidos: el zumo se vuelve rosa. El bicarbonato es lo contrario de un ácido (una base): el zumo se vuelve azul o verde. Los químicos lo llaman un indicador.",
  variante: "Prueba otros líquidos de la cocina: agua con gas, leche, agua con jabón. ¡Adivina el color antes de echarlos!",
  depannage: [["Zumo demasiado pálido", "Poca lombarda o demasiada agua", "Menos agua, o deja reducir el zumo."], ["No hay un cambio claro", "Muy poco ingrediente", "Añade otra cucharada."], ["Huele mucho", "Es normal con la lombarda cocida", "Abre una ventana; se va enseguida."]],
  securite: ["Usa solo productos de cocina: nunca productos de limpieza (lejía, detergente) para probar colores.", "La cazuela caliente es cosa del adulto; las pociones no se beben."]
},
"herisson-feuilles": {
  titre: "Erizo de hojas secas",
  accroche: "Recoge hojas en un paseo y pégalas como púas de un erizo dibujado. Un paseo y una manualidad a la vez.",
  age: "a partir de 3 años",
  materiel: [["Hojas caídas de distintos tamaños y colores", "Recogidas secas, o secadas 2 días entre dos libros."], ["Una hoja de papel grueso o de cartón", ""], ["Cola líquida o barra de pegamento", ""], ["Ceras o rotuladores", "Para la cabeza, el ojo y la nariz."]],
  seances: [{ titre: "Pasear y pegar", etapes: ["Durante un paseo, recoge hojas de varios colores: amarillas, rojas, marrones.", "Dibuja el cuerpo del erizo: un gran semicírculo, con una cabeza puntiaguda a un lado.", "Dibuja el ojo, la nariz redonda en la punta del hocico y las patitas.", "Pega las hojas en el lomo empezando por detrás, con las puntas hacia fuera, montando unas sobre otras.", "Sigue hasta la cabeza: las hojas son las púas.", "Dibuja una manzana o una seta al lado del erizo."] }],
  science: "¿Sabías que…? Un erizo tiene unas 6000 púas. En invierno hiberna bajo un montón de hojas: si dejas un rincón con hojas secas en el jardín, le das un refugio.",
  variante: "La misma idea sirve para un zorro (hojas rojizas) o un búho (hojas como plumas).",
  depannage: [["Las hojas se desmigajan", "Demasiado secas", "Cógelas recién caídas, o humedécelas un poco."], ["Las hojas se despegan", "La barra de pegamento no agarra bastante", "Cola líquida, o un trocito de cinta."]],
  securite: ["Lávate las manos después de recoger las hojas; nada a la boca."]
},
"empreintes-feuilles": {
  titre: "Huellas de hojas",
  accroche: "Pinta el revés de una hoja de árbol y apriétala sobre un papel: aparecen todos los nervios, como una radiografía de la naturaleza.",
  age: "a partir de 3 años",
  materiel: [["Hojas de árbol frescas, todavía flexibles", "Las hojas secas se rompen."], ["Témpera o pintura acrílica", "Colores de otoño o colores vivos."], ["Un pincel o un rodillo de espuma", ""], ["Papel grueso", ""], ["Una hoja de periódico", "Para apretar sin mancharte."]],
  seances: [{ titre: "Estampar", etapes: ["Da la vuelta a la hoja: el revés, con los nervios en relieve, es el que mejor marca.", "Pinta todo el revés con una capa fina de pintura.", "Coloca la hoja sobre el papel con la pintura hacia abajo.", "Tápala con papel de periódico y aprieta por todas partes con la mano o con un rodillo.", "Levanta la hoja por el tallo de una vez.", "Repite con otras hojas y otros colores, superponiéndolas."] }],
  science: "Los nervios son las tuberías de la hoja: llevan el agua y la savia. Compara hojas: el roble, el arce y el castaño tienen dibujos completamente distintos.",
  variante: "Dibuja un tronco y unas ramas, y luego estampa hojas alrededor: un árbol de otoño entero.",
  depannage: [["La huella es una mancha", "Demasiada pintura", "Capa más fina y bien extendida."], ["No salen los nervios", "Se ha estampado el derecho", "Pinta el revés de la hoja."], ["La hoja se rompe", "Hoja demasiado seca", "Usa hojas frescas."]],
  securite: ["La pintura acrílica mancha la ropa: ponte un delantal."]
},
"mangeoire": {
  titre: "Comedero de piña para pájaros",
  accroche: "Una piña rellena de grasa vegetal y semillas, colgada fuera: y a mirar cómo vienen los herrerillos a darse un festín.",
  age: "a partir de 3 años",
  materiel: [["Piñas abiertas y secas", "Recogidas en un paseo."], ["Grasa vegetal sólida (manteca vegetal o grasa de coco)", "Sin aceite de palma, si puede ser."], ["Una mezcla de semillas para pájaros", "Pipas de girasol, cacahuetes sin sal, maíz partido."], ["Cordel", ""], ["Un bol y una cuchara", ""]],
  seances: [{ titre: "Preparar", etapes: ["Ata un cordel resistente alrededor de la parte de arriba de cada piña.", "Ablanda la grasa (el adulto la templa con suavidad, sin que llegue a calentarse mucho).", "Mézclala con las semillas en el bol.", "Con la cuchara, rellena bien los huecos entre las escamas de la piña.", "Luego hazla rodar por las semillas para cubrirla bien.", "Métela 1 hora en la nevera para que se endurezca."] }, { titre: "Colgar y observar", etapes: ["Cuelga el comedero en un sitio despejado, lejos de los arbustos donde se esconden los gatos, y que se vea desde una ventana.", "Observa cada día: ¿quién viene? ¿Un herrerillo, un petirrojo, un gorrión?", "Lleva un cuadernito de visitas con un dibujo de cada uno."] }],
  science: "A los pájaros solo se les da de comer en invierno, sobre todo cuando hiela: es cuando menos comida encuentran. En primavera, ve reduciendo y luego deja de hacerlo, para que alimenten a sus crías con insectos.",
  variante: "Una manzana o una naranja cortada por la mitad, vaciada y rellena con la misma mezcla también es un comedero muy bonito.",
  depannage: [["La mezcla no se sujeta", "Grasa demasiado líquida", "Déjala enfriar un poco antes de rellenar."], ["No viene ningún pájaro", "Sitio demasiado expuesto o demasiado nuevo", "Espera unos días, acércalo a un árbol."]],
  securite: ["Nunca pan, leche ni comida salada: les sientan mal a los pájaros.", "Cuidado con las alergias a los cacahuetes en los niños: en ese caso, usa una mezcla sin cacahuetes.", "Lávate las manos después de tocar las semillas."]
},
"volcan": {

  age: "a partir de 4 años",
  materiel: [["Una botellita de plástico (330 ml)", ""], ["Un barreño grande o una fuente de horno", "¡El volcán se desborda!"], ["Arena, tierra o masa de sal", "Para construir la montaña."], ["1 vaso de vinagre blanco", ""], ["2 cucharadas soperas de bicarbonato sódico", ""], ["Colorante alimentario rojo o sirope de granadina", "Para el color de la lava."], ["Un poco de lavavajillas", "Opcional: más espuma."]],
  seances: [{ titre: "Construir", etapes: ["Pon la botella de pie en el centro del barreño.", "Construye alrededor una montaña de arena húmeda, dejando libre el cuello.", "Echa en la botella el vinagre, el colorante y una gota de lavavajillas."] }, { titre: "La erupción", etapes: ["Todo el mundo da un paso atrás.", "Echa el bicarbonato por el cuello de una sola vez (un embudo de papel ayuda).", "Mira cómo la lava hace espuma y baja por las laderas.", "Vuelve a probar con otras cantidades: ¿más bicarbonato, erupción más grande?"] }],
  science: "El vinagre y el bicarbonato reaccionan juntos y producen un gas, el dióxido de carbono. Este gas ocupa mucho espacio: empuja el líquido fuera de la botella. En un volcán de verdad, los gases también empujan el magma hacia arriba.",
  variante: "Hazlo al aire libre y compara la erupción con vinagre frío y con vinagre templado.",
  depannage: [["Casi no hay espuma", "Poco bicarbonato o vinagre sin fuerza", "Más bicarbonato, vinagre nuevo."], ["Solo burbujea en el fondo", "Bicarbonato echado poco a poco", "Échalo todo de golpe."], ["La arena se desmorona", "Arena demasiado seca", "Humedécela para que se sostenga."]],
  securite: ["No te asomes al cuello de la botella durante la erupción, y nunca pongas el tapón.", "El vinagre pica en los ojos: lávate las manos después."]
},
"flotte-coule": {
  titre: "¿Flota o se hunde?",
  accroche: "Una bola de plastilina se hunde… ¡pero la misma plastilina en forma de barco flota! Un experimento para ser capitán y científico a la vez.",
  age: "a partir de 3 años",
  materiel: [["Un barreño con agua", ""], ["Plastilina", "Un trozo del tamaño de una pelota de ping-pong."], ["Objetos de casa", "Corcho, cuchara, pelota, llave, manzana, lápiz, piedra…"], ["Pequeños tesoros como carga", "Canicas, clips, monedas: con un adulto vigilando."], ["Una hoja y un lápiz", "Para apuntar las predicciones."]],
  seances: [{ titre: "Predecir y probar", etapes: ["Pon los objetos junto al barreño y dibuja dos columnas: «flota» y «se hunde».", "Con cada objeto, el niño predice primero y luego lo prueba en el agua.", "Compara las predicciones con los resultados: ¿alguna sorpresa?"] }, { titre: "El reto del barco", etapes: ["Haz una bola de plastilina y ponla en el agua: se hunde.", "Coge la misma plastilina y aplánala en forma de barquito con los bordes levantados.", "Ponlo en el agua con cuidado: ¡flota!", "Carga el barco con canicas una a una. ¿Cuántas aguanta antes de hundirse?", "Prueba otra forma de barco para batir el récord."] }],
  science: "No solo importa el peso, también la forma. Aplanada como un barco, la plastilina aparta mucha agua, y el agua la empuja hacia arriba. En forma de bola, aparta muy poca y se hunde. Por eso flotan barcos de metal pesadísimos.",
  variante: "Echa mucha sal en el agua y prueba con un huevo: en agua salada, vuelve a subir.",
  depannage: [["Al barco le entra agua", "Bordes demasiado bajos o un agujero", "Sube los bordes y hazlos más gruesos."], ["El barco vuelca", "Toda la carga en un lado", "Reparte las canicas en el centro."]],
  securite: ["Nunca dejes a un niño solo cerca de un barreño con agua, por poca que tenga.", "Canicas y monedas fuera del alcance de los menores de 3 años."]
},
"bulles-geantes": {
  titre: "Pompas gigantes",
  accroche: "Una mezcla casera para pompas y dos palos con un cordel: pompas más grandes que los niños.",
  age: "a partir de 3 años",
  materiel: [["400 ml de agua (embotellada si el agua del grifo es dura)", ""], ["100 ml de lavavajillas", "El resultado cambia según la marca: prueba la tuya."], ["3 cucharadas soperas de azúcar", ""], ["1 cucharada sopera de maicena", "O glicerina, de la farmacia."], ["Dos palos de unos 80 cm", "Varillas de madera, cañas de jardín."], ["Cordel de algodón", "Un trozo de 50 cm y otro de 100 cm."], ["Un barreño ancho", "Para mojar el cordel."]],
  seances: [{ titre: "El día antes: la receta", etapes: ["Disuelve el azúcar y la maicena en un poco de agua.", "Añade el resto del agua y luego el lavavajillas, removiendo suavemente para que no haga espuma.", "Déjalo reposar al menos 12 horas: las pompas serán mucho más resistentes."] }, { titre: "Hacer la varita", etapes: ["Ata los dos cordeles a las puntas de los dos palos: el corto arriba y el largo colgando debajo, formando un lazo.", "Junta los palos: al separarlos, el cordel forma un triángulo."] }, { titre: "Hacer pompas", etapes: ["Moja todo el cordel en el barreño, con los palos juntos.", "Sácalo con cuidado y separa los palos: se forma una película de jabón.", "Camina despacio hacia atrás o deja que el viento sople dentro.", "Junta los palos para cerrar la pompa y dejarla volar."] }],
  science: "El lavavajillas permite que el agua se estire en una película muy fina. El azúcar y la maicena la espesan y hacen que escurra más despacio: la pompa tarda más en explotar. Los colores vienen de la luz que se refleja en las dos caras de la película.",
  variante: "El mejor momento: un día fresco y húmedo, con solo un poco de viento, por ejemplo después de un chaparrón.",
  depannage: [["Las pompas explotan enseguida", "Poco espesa o sin reposo", "Más maicena y reposo durante la noche."], ["Las pompas pesan y caen", "Demasiado azúcar", "Menos azúcar."], ["Mucha espuma", "Removido demasiado fuerte", "Remueve con suavidad y quita la espuma con una cuchara."], ["No funciona nada", "Lavavajillas poco adecuado", "Prueba otra marca."]],
  securite: ["El suelo se vuelve resbaladizo: jugad fuera, sobre hierba si puede ser.", "La mezcla pica en los ojos: aclara con agua limpia si hace falta."]
},
"tigre-rouleau": {
  titre: "Tigre de rollo de cartón",

  materiel: [["Un rollo de papel higiénico vacío", ""], ["Pintura naranja y negra", "O papel naranja para pegar alrededor del rollo."], ["Papel blanco y rotulador negro", "Para el hocico y los ojos."], ["Pegamento y tijeras", ""], ["Un pincel fino", "Para las rayas."]],
  seances: [{ titre: "Manos a la obra", etapes: ["Pinta todo el rollo de naranja y deja que se seque.", "Con un pincel fino o un rotulador, dibuja rayas negras en zigzag por todo el rollo, dejando un hueco libre delante para la cara.", "Dobla la parte de arriba del rollo hacia dentro, primero un lado y luego el otro: así salen dos orejas. Si quieres, redondéalas con las tijeras.", "Recorta un óvalo blanco para el hocico y pégalo en el centro de la cara.", "Dibuja los ojos, una nariz en forma de triángulo, la boca y los bigotes.", "Pega detrás, abajo, una cola de papel con rayas."] }],

  variante: "Mismo rollo, otros colores: un león con melena de lana, una cebra blanca y negra, una jirafa con manchas. ¡Toda la sabana!",

"bracelet-disque": {

  age: "a partir de 6 años; el adulto prepara el disco",
  materiel: [["Cartón grueso (de caja de envío)", "Para el disco."], ["Un cuenco o un compás", "Para dibujar un círculo de unos 10 cm de diámetro."], ["7 hilos de bordar de colores distintos", "Unos 50 cm cada uno."], ["Tijeras, y un cúter para el adulto", ""], ["Un lápiz", "Para numerar las muescas."]],
  seances: [{ titre: "Hacer el disco", etapes: ["Dibuja en el cartón un círculo de unos 10 cm de diámetro y recórtalo.", "Recorta 8 muescas repartidas por el borde, de 1 cm de profundidad más o menos (como un reloj: arriba, abajo, izquierda, derecha y una entre cada una).", "El adulto hace en el centro un agujero de unos 1,5 cm de diámetro."] }, { titre: "Colocar los hilos", etapes: ["Ata los 7 hilos juntos con un nudo en un extremo.", "Pasa el nudo por el agujero del centro desde arriba, para que quede colgando bajo el disco.", "Mete un hilo en cada muesca: una muesca se queda vacía."] }, { titre: "Trenzar", etapes: ["Sujeta el disco con la muesca vacía mirando hacia ti.", "Empezando por la muesca vacía, cuenta 3 hilos hacia la derecha. Saca ese 3.er hilo de su muesca y mételo en la vacía.", "Gira el disco para que la nueva muesca vacía quede frente a ti.", "Repite: siempre el 3.er hilo hacia la derecha, siempre a la muesca vacía.", "Poco a poco, sale una trenza redonda por debajo del disco. De vez en cuando, tira suavemente del nudo.", "Cuando la trenza dé la vuelta a la muñeca, saca los hilos de las muescas y haz un nudo bien apretado. ¡Átate la pulsera!"] }],
  variante: "Con solo dos colores (4 hilos de uno y 3 del otro) sale una espiral muy bonita. También puedes meter una cuenta al final.",
  depannage: [["La trenza queda irregular", "Cambias el sentido al contar", "Cuenta siempre hacia el mismo lado, siempre 3 hilos."], ["Las muescas se estropean", "Cartón demasiado fino", "Vuelve a hacer el disco con cartón grueso, o ponle doble capa."], ["Te pierdes", "Has hecho una pausa a mitad", "El último hilo que has movido está siempre justo al lado de la muesca vacía."]],
  securite: ["El cúter para el agujero del centro es cosa del adulto.", "Los hilos no se ponen alrededor del cuello."]
},
"eruptions-arc-en-ciel": {
  titre: "Erupciones arcoíris",

  age: "a partir de 2 años con cuchara, a partir de 3 años con cuentagotas",
  materiel: [["Bicarbonato sódico", "Más o menos medio paquete."], ["Vinagre blanco", "Un vaso por color."], ["Colorantes alimentarios", "Rojo, amarillo y azul: suficiente para todo el arcoíris."], ["Una fuente de horno, una cubitera o un molde de magdalenas", ""], ["Cuentagotas, o cucharas para los más pequeños", ""], ["Vasitos o tarros pequeños", "Uno por color."]],
  seances: [{ titre: "Preparar", etapes: ["Extiende una buena capa de bicarbonato en la fuente, o llena cada hueco de la cubitera.", "Echa vinagre en cada vasito y añade un color distinto.", "Mezcla rojo y amarillo para el naranja, amarillo y azul para el verde, rojo y azul para el morado."] }, { titre: "¡A burbujear!", etapes: ["Coge un poco de vinagre de color con el cuentagotas.", "Deja caer unas gotas sobre el bicarbonato: ¡burbujea enseguida!", "Cambia de color y llena todos los huecos, o dibuja un arcoíris en la fuente.", "Mira cómo se mezclan los colores cuando dos erupciones se juntan."] }],
  science: "El vinagre y el bicarbonato reaccionan y producen un gas, el dióxido de carbono. Sus burbujas forman la espuma. Cuando en un sitio ya no queda bicarbonato, deja de burbujear: añade más.",
  variante: "Para los peques, cambia los cuentagotas por cucharas. Para practicar la pinza con los dedos, usa cuentagotas.",
  depannage: [["Ya no burbujea", "Todo el bicarbonato ha reaccionado", "Añade otra capa."], ["Los colores se vuelven marrones", "Demasiada mezcla", "Usa un hueco nuevo para cada color, o vacía y vuelve a empezar."], ["El cuentagotas no coge nada", "El vasito no está lo bastante lleno", "Llena el vasito al menos 2 cm."]],

},
"pate-a-patouille": {
  titre: "Oobleck (masa mágica)",

  age: "desde los 18 meses, siempre con un adulto",
  materiel: [["2 tazas de maicena", "Almidón de maíz o similar."], ["1 taza de agua", "Échala poco a poco."], ["Colorante alimentario", "Opcional."], ["Una fuente grande o un barreño", ""], ["Cucharas, un embudo, figuritas", "Para jugar."]],
  seances: [{ titre: "Preparar y jugar", etapes: ["Echa la maicena en la fuente.", "Añade el agua (y el colorante) poco a poco, mezclando con los dedos.", "La textura perfecta: si le das un golpecito, resiste; si la coges con suavidad, se escurre.", "¿Demasiado líquida? Un poco de maicena. ¿Demasiado dura? Unas gotas de agua.", "Dale un buen puñetazo y luego apoya la mano con suavidad: ¡se hunde!", "Haz una bola girándola rápido entre las manos y luego para: se derrite."] }],
  science: "Es un fluido «no newtoniano». Unos granitos diminutos de almidón flotan en el agua. Cuando empujas rápido y fuerte, se atascan entre sí y la masa se pone dura. Cuando vas despacio, les da tiempo a deslizarse y fluye como un líquido.",
  variante: "Esconde figuritas dentro y «rescátalas» con una cuchara.",
  depannage: [["Está toda líquida", "Demasiada agua", "Añade maicena cucharada a cucharada."], ["Está dura y se desmigaja", "Falta agua", "Unas gotas de agua."], ["Se ha secado", "Evaporación", "Añade un poco de agua y vuelve a mezclar."]],
  securite: ["Nunca la tires por el fregadero: puede atascar las tuberías. Déjala secar y tírala a la basura.", "Aunque sean ingredientes de cocina, no se come.", "Con los más pequeños, un adulto se queda cerca todo el rato."]
},
"carte-a-gratter": {
  titre: "Tarjeta para rascar casera",

  seances: [{ titre: "Preparar la tarjeta", etapes: ["Recorta un rectángulo de cartulina.", "Colorea toda la superficie con las ceras, apretando fuerte: rayas, manchas, arcoíris.", "Quita las migas de cera con un pañuelo de papel.", "Mezcla 2 partes de pintura negra con 1 parte de lavavajillas.", "Pasa una capa uniforme con el pincel por toda la tarjeta.", "Deja secar de 30 a 45 minutos."] }, { titre: "Rascar", etapes: ["Dibuja rascando con el palito: aparecen los colores.", "Prueba líneas finas, espirales, rayitas, puntos.", "En Pascua: huevos decorados; en Navidad: árboles y estrellas."] }],

  securite: ["Brochetas cortadas con la punta redondeada para los más pequeños.", "El acrílico mancha: ponte un delantal."]

"calendrier-avent": {

  age: "a partir de 4 años",
  materiel: [["24 rollos de papel higiénico", "¡Empieza a guardarlos en octubre! O 12 rollos de cocina cortados por la mitad."], ["Papel de regalo, papel de seda o papel de colores", "Para cerrar los extremos."], ["Pegamento, cinta adhesiva, tijeras", ""], ["Rotuladores o pegatinas con números", "Para numerar del 1 al 24."], ["Una caja grande o de zapatos", "Para colocar los rollos en forma de árbol o pirámide."], ["24 sorpresitas", "Golosinas, pegatinas o notas con actividades (mira la variante)."]],

"pluie-bocal": {

  age: "a partir de 3 años",
  materiel: [["Un tarro grande o un jarrón transparente", ""], ["Agua", "Tres cuartos del tarro."], ["Espuma de afeitar", "La pone el adulto."], ["Colorante alimentario líquido diluido en un poco de agua", "Azul para la lluvia, o varios colores."], ["Un cuentagotas o una cuchara", ""]],
  seances: [{ titre: "¡Que llueva!", etapes: ["Llena el tarro de agua hasta tres cuartos.", "El adulto pone una capa gruesa de espuma de afeitar sobre el agua: es la nube.", "Con el cuentagotas, echa colorante diluido sobre la nube.", "Sigue, gota a gota… y mira debajo de la nube.", "Cuando la nube pesa demasiado, caen hilos de color en el agua: ¡está lloviendo!"] }],

},

function initLang() {

  if (!LOCALES[LANG]) LANG = "fr";
  document.documentElement.lang = LANG;
}
/* t("texte", {n: 3}) : traduit une phrase de l'interface et remplit les {variables} */
function t(s, vars) {
  let out = LANG === "fr" ? s : ((UI[s] && UI[s][LIDX[LANG]]) || s);
  if (vars) for (const k in vars) out = out.split("{" + k + "}").join(vars[k]);

  const tr = TRAD[LANG][a.id];
  return Object.assign({}, a, tr, { _tr: true });
}

        <button class="card" data-open="${a.id}" style="--c:${a.couleur}">

            </div>

}
function momentBlock() {
  const m = MOMENT, picks = momentPicks(m), done = faits();
  const F = { halloween: ["Halloween dans {n} jours", "C'est Halloween demain !", "C'est Halloween aujourd'hui !"], noel: ["Noël dans {n} jours", "C'est Noël demain !", "Joyeux Noël !"], paques: ["Pâques dans {n} jours", "C'est Pâques demain !", "Joyeuses Pâques !"] }[m.id];
  const compte = !F || m.jours == null || m.jours < 0 ? "" : m.jours > 1 ? t(F[0], { n: m.jours }) : t(F[m.jours === 1 ? 1 : 2]);
  return `<section class="moment" aria-label="${esc(t(m.titre))}">
    <div class="section-head"><h2>${t(m.titre)}</h2>${compte ? `<span class="countdown">${compte}</span>` : ""}</div>
    <p class="lead">${t(m.sous)}</p>
    <div class="grid">${picks.map(a0 => cardHTML(a0, done)).join("")}</div>
    <p class="moment-more"><button class="btn ghost" id="moment-all">${t("Voir toutes les idées {x}", { x: t(m.chip) })}</button></p>
  </section>`;
}

    <section class="carnet" aria-label="${t("Carnet de tampons")}">

      <div class="stamp-row">${ACTIVITIES.map(a0 => { const a = L(a0); return `<button class="stamp ${done.includes(a.id) ? "on" : ""} ${isGold(a.id) ? "gold" : ""}" data-open="${a.id}" title="${esc(a.titre)}${isGold(a.id) ? " : " + t("tampon doré") : done.includes(a.id) ? " : " + t("réussi") : ""}">${ART[a.id] ? ART[a.id]() : ""}</button>`; }).join("")}</div>

      <div class="card idea"><div class="body">

/* ---------- Fiche ---------- */
function renderActivity(a0) {
  const a = L(a0), m = meta(a);
  const tabs = [["materiel", "🧺 Matériel"], a.melange ? ["melange", "🥄 Mélange"] : null, ["etapes", "✂️ Étapes"], ["depannage", "🛠 Si ça rate"], ["securite", "⚠️ Sécurité"]].filter(Boolean);

  const done = isDone(a.id);
  $("#app").innerHTML = `
    ${topbar()}
    <div class="row"><button class="back" id="back">${t("← Toutes les activités")}</button><button class="btn small ghost" id="other">${t("🎲 Une autre idée")}</button></div>
    <section class="hero" style="--c:${a.couleur}">

      <div class="intro">
        <span class="label">${esc(t(a.categorie))} · ${dots(m.niveau)} ${t(NIVEAUX[m.niveau])}</span>
        <h2>${esc(a.titre)}</h2>
        <p>${esc(a.accroche)}</p>
        <div class="facts-row">${a0.faits.map(f => `<div class="fact"><span class="label">${esc(t(f[0]))}</span><strong>${esc(t(f[1]))}</strong></div>`).join("")}</div>
        ${m.skills.length ? `<div class="skills"><span class="label">${t("Ça fait travailler")}</span>${m.skills.map(s => `<span class="skill">${esc(t(s))}</span>`).join("")}</div>` : ""}
        <p class="note">${esc(t("Âge : {a}.", { a: a.age }))}</p>

    </section>
    <nav class="tabs" role="tablist">
      ${tabs.map(x => `<button class="tab" role="tab" id="tab-${x[0]}" data-tab="${x[0]}" aria-selected="${state.tab === x[0]}">${t(x[1])}</button>`).join("")}
    </nav>
    <section class="panel" id="panel" role="tabpanel"></section>
    <div class="done-box" style="margin-top:22px">
      <div><strong>${t(done ? "Bravo, tampon gagné !" : "Vous l'avez fait ?")}</strong><p class="note">${t(done ? "L'activité est dans ton carnet de tampons." : "Appuie ici quand c'est fini pour gagner le tampon de cette activité.")}</p></div>

        ${CODE_DORE() ? `<label class="label" for="gold-code" style="flex-basis:100%">${t("Code magique")}</label>
        <input id="gold-code" autocomplete="off" placeholder="${t("Ton code")}" style="flex:1 1 140px;min-width:0;font:inherit;font-weight:800;text-transform:uppercase;padding:9px 14px;border:2.5px solid var(--line);border-radius:999px">
        <button class="btn small" id="gold-ok">${t("Valider")}</button><span class="note" id="gold-msg" aria-live="polite"></span>` : ""}</div>`}

    <section class="carnet galerie" style="margin-top:22px;background:var(--paper)">
      <div class="row"><h3>${t("🖼 Leurs réalisations")}</h3>${contribButton("📸 Envoie ta photo")}</div>

      ${LANG !== "fr" ? `<span class="note">${t("Sources en français.")}</span>` : ""}

  bindTopbar();
  $("#back").onclick = () => go("");
  $("#other").onclick = () => surprise(a.id);

    else $("#gold-msg").textContent = t("Ce code ne marche pas. Vérifie les lettres avec un parent : le code s'affiche juste après l'envoi de la photo.");
  };

function renderPanel(a) {
  const p = $("#panel");
  const loc = LOCALES[LANG];
  if (state.tab === "materiel") {
    const key = "check-" + a.id, done = store.get(key, []);
    p.innerHTML = `
      <div class="row"><span class="progress" id="prog"></span><button class="btn ghost" id="reset">${t("Tout décocher")}</button></div>
      <ul class="check">${a.materiel.map((m, i) => `
        <li><label><input type="checkbox" id="m-${i}" ${done.includes(i) ? "checked" : ""}><span>${esc(m[0])}${m[1] ? `<span class="why">${esc(m[1])}</span>` : ""}</span></label></li>`).join("")}</ul>`;
    const upd = () => {
      const d = a.materiel.map((_, i) => $("#m-" + i).checked ? i : -1).filter(i => i >= 0);
      store.set(key, d);
      $("#prog").textContent = t("{n} / {t} prêts", { n: d.length, t: a.materiel.length });
    };
    a.materiel.forEach((_, i) => $("#m-" + i).onchange = upd);
    $("#reset").onclick = () => { store.set(key, []); renderPanel(a); };
    upd();
  }
  if (state.tab === "melange") {
    const f = state.couleurs * (state.grand ? 2 : 1);
    const fmt = n => Number.isInteger(n) ? n : (LANG === "en" ? n.toFixed(1) : n.toFixed(1).replace(".", ","));
    p.innerHTML = `
      <p>${t("Règle de base : 2 volumes de colle pour 1 volume de liquide vaisselle, puis la couleur. Un pot par couleur.")}</p>
      <div class="calc">
        <div class="row" style="justify-content:space-between">
          <div class="stepper"><span class="label">${t("Couleurs")}</span>
            <button id="minus" aria-label="${t("Une couleur de moins")}">−</button><output id="nc">${state.couleurs}</output><button id="plus" aria-label="${t("Une couleur de plus")}">+</button></div>
          <div class="seg" role="group" aria-label="${t("Taille des motifs")}">
            <button id="petit" aria-pressed="${!state.grand}">${t("Petits motifs")}</button><button id="grand" aria-pressed="${state.grand}">${t("Grands motifs")}</button></div>
        </div>
        <div><span class="label">${t("Au total, pour {n} pot(s)", { n: state.couleurs })}</span></div>
        <div class="qty">${a.melange.base.map(b => `<div><strong>${fmt(b[1] * f)} ${esc(t(b[2]))}</strong>${esc(t(b[0]))}${b[0] === "Colorant" ? " " + t("(par pot : {n})", { n: b[1] * (state.grand ? 2 : 1) }) : ""}</div>`).join("")}</div>
      </div>
      <div class="row"><button class="btn" id="tstart">${t("Lancer les 3 min de repos")}</button><span class="timer" id="tdisp" aria-live="polite"></span></div>
      <p class="note">${t("Mélangez doucement pour limiter les bulles. S'il coule trop, ajoutez un peu de colle. Si les pièces sortent collantes, mettez moins de liquide vaisselle au pot suivant.")}</p>`;
    $("#minus").onclick = () => { state.couleurs = Math.max(1, state.couleurs - 1); renderPanel(a); };
    $("#plus").onclick = () => { state.couleurs = Math.min(8, state.couleurs + 1); renderPanel(a); };
    $("#petit").onclick = () => { state.grand = false; renderPanel(a); };
    $("#grand").onclick = () => { state.grand = true; renderPanel(a); };
    $("#tstart").onclick = () => startTimer(a.melange.repos);
    tickTimer();
  }
  if (state.tab === "etapes") {
    const all = a.seances.flatMap(s => s.etapes.map(e => ({ s: s.titre, e })));
    if (state.pas) {
      const i = Math.min(state.stepIdx, all.length - 1), cur = all[i];
      p.innerHTML = `
        <div class="focus">
          <div class="session"><span class="label">${esc(cur.s)} · ${t("étape {i} sur {n}", { i: i + 1, n: all.length })}</span>
            <div class="bar"><i style="width:${((i + 1) / all.length) * 100}%"></i></div></div>
          <p class="big">${esc(cur.e)}</p>
          <div class="row" style="justify-content:space-between">
            <button class="btn ghost" id="prev" ${i === 0 ? "disabled" : ""}>${t("Précédente")}</button>
            ${i < all.length - 1 ? `<button class="btn" id="next">${t("Suivante")}</button>` : `<button class="btn" id="fin">${t("Terminé")}</button>`}
          </div>
        </div>
        <button class="btn ghost" id="quit">${t("Voir toutes les étapes")}</button>
        <p class="note">${t("L'écran reste allumé en mode pas à pas, quand le téléphone le permet.")}</p>`;
      if ($("#prev")) $("#prev").onclick = () => { state.stepIdx = i - 1; renderPanel(a); };
      if ($("#next")) $("#next").onclick = () => { state.stepIdx = i + 1; renderPanel(a); };
      if ($("#fin")) $("#fin").onclick = () => { state.pas = false; releaseWake(); renderPanel(a); };
      $("#quit").onclick = () => { state.pas = false; releaseWake(); renderPanel(a); };
      return;
    }
    const dryKey = "dry-" + a.id, dryAt = store.get(dryKey, 0);
    const opts = { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" };
    const when = h => new Date(dryAt + h * 3600e3).toLocaleString(loc, opts);
    p.innerHTML = `
      <div class="row"><button class="btn" id="go">${t("Mode pas à pas")}</button><span class="note">${t("Une étape à la fois, en gros, pour le téléphone posé sur la table.")}</span></div>
      ${a.patron ? `<div class="session"><h3>${t("Le patron")}</h3>${patronSVG()}</div>` : ""}
      ${a.patronBoite ? `<div class="session"><h3>${t("Le patron")}</h3><div class="table-wrap">${patronBoiteSVG()}</div></div>` : ""}
      ${a.patronDisque ? `<div class="session"><h3>${t("Le disque")}</h3>${patronDisqueSVG()}</div>` : ""}
      ${a.seances.map(s => `<div class="session"><h3>${esc(s.titre)}</h3><ol class="steps">${s.etapes.map(e => `<li><span>${esc(e)}</span></li>`).join("")}</ol></div>`).join("")}
      ${a.science ? `<div class="science"><strong>${t("🔬 Le petit mot de science")}</strong><p>${esc(a.science.replace(/^Pourquoi ça marche : /, ""))}</p></div>` : ""}
      ${a.sechage ? `<div class="dry">
        <span class="label">${t("Suivi du séchage")}</span>
        ${dryAt ? `<p>${esc(t("Mis à sécher le {d}. Sec au plus tôt le {a}, au plus tard le {b}.", { d: new Date(dryAt).toLocaleString(loc, opts), a: when(a.sechage[0]), b: when(a.sechage[1]) }))}</p>
          <div class="row"><button class="btn ghost" id="dryreset">${t("Effacer")}</button></div>`
        : `<p class="note">${t("Appuyez quand votre création part sécher : la page calcule quand elle sera prête.")}</p>
          <div class="row"><button class="btn ghost" id="drynow">${t("On vient de mettre à sécher")}</button></div>`}
      </div>` : ""}
      <p class="note">${esc(a.variante)}</p>`;
    $("#go").onclick = () => { state.pas = true; state.stepIdx = 0; requestWake(); renderPanel(a); };
    if ($("#drynow")) $("#drynow").onclick = () => { store.set(dryKey, Date.now()); renderPanel(a); };
    if ($("#dryreset")) $("#dryreset").onclick = () => { store.set(dryKey, 0); renderPanel(a); };
  }
  if (state.tab === "depannage") {
    p.innerHTML = `<div class="table-wrap"><table><thead><tr><th>${t("Problème")}</th><th>${t("Cause probable")}</th><th>${t("Solution")}</th></tr></thead>
      <tbody>${a.depannage.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if (state.tab === "securite") {
    p.innerHTML = `<ul class="bullets">${a.securite.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  }
}

/* Minuteur de repos */
function startTimer(sec) {
  state.timerEnd = Date.now() + sec * 1000;
  clearInterval(state.timer);
  state.timer = setInterval(tickTimer, 500);
  tickTimer();
}
function tickTimer() {
  const d = $("#tdisp"); if (!d || !state.timerEnd) return;
  const left = Math.max(0, Math.round((state.timerEnd - Date.now()) / 1000));
  d.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : t("Prêt à peindre");
  if (left === 0) clearInterval(state.timer);
}

/* Écran allumé en mode pas à pas */
async function requestWake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) { wakeLock = null; } }
function releaseWake() { try { wakeLock?.release(); } catch (e) {} wakeLock = null; }

/* Routage par ancre simple */
function route() {
  const id = (SITE && SITE.start) || location.hash.replace("#", "");
  const a = ACTIVITIES.find(x => x.id === id);
  if (a) { state.tab = "materiel"; state.pas = false; renderActivity(a); window.scrollTo(0, 0); }
  else { releaseWake(); renderHome(); }
}
window.addEventListener("hashchange", route);
initLang();
route();
</script>
